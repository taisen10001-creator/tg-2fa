<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>验证器</title>

<style>
:root{
    --bg:#f5f5f5;
    --card:#ffffff;
    --text:#202124;
    --secondary:#5f6368;
    --line:#e5e5e5;
    --blue:#1a73e8;
    --danger:#d93025;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

.app{
    max-width:600px;
    margin:auto;
    min-height:100vh;
}

/* =========================
   顶部
========================= */

.header{
    height:78px;
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:10;
}

.title-area{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:3px;
}

.title{
    font-size:21px;
    font-weight:500;
}

.telegram-contact{
    display:inline-block;
    width:max-content;
    color:var(--blue);
    text-decoration:none;
    font-size:13px;
    font-weight:500;
}

.telegram-contact:active{
    opacity:.6;
}

.add-top{
    width:44px;
    height:44px;
    border:0;
    background:transparent;
    border-radius:50%;
    font-size:30px;
    line-height:44px;
    color:var(--blue);
    cursor:pointer;
}

.add-top:active{
    background:#eeeeee;
}

/* =========================
   内容
========================= */

.content{
    padding:16px;
}

/* =========================
   账号卡片
========================= */

.account{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
}

.account-name{
    font-size:16px;
    font-weight:500;
    margin-bottom:4px;
    word-break:break-word;
}

.account-secret{
    color:var(--secondary);
    font-size:13px;
    margin-bottom:18px;
}

.code-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.code{
    font-size:34px;
    font-weight:500;
    letter-spacing:4px;
    color:#202124;
    font-variant-numeric:tabular-nums;
}

.copy{
    border:0;
    background:#f1f3f4;
    color:var(--blue);
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
}

.copy:active{
    background:#e8eaed;
}

.bottom-row{
    margin-top:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.time-text{
    font-size:13px;
    color:var(--secondary);
    white-space:nowrap;
}

.progress{
    flex:1;
    height:4px;
    background:#e5e5e5;
    border-radius:10px;
    margin-left:12px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:100%;
    background:var(--blue);
    border-radius:10px;
    transition:width .3s linear;
}

.delete{
    border:0;
    background:transparent;
    color:var(--danger);
    font-size:13px;
    padding:4px;
    margin-left:10px;
}

/* =========================
   没有账号
========================= */

.empty{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    text-align:center;
    padding:55px 20px;
    color:var(--secondary);
}

.empty-icon{
    font-size:42px;
    margin-bottom:14px;
}

.empty-title{
    color:var(--text);
    font-size:18px;
    margin-bottom:8px;
}

.empty-text{
    font-size:14px;
    line-height:1.6;
}

/* =========================
   底部添加按钮
========================= */

.add-button{
    width:100%;
    margin-top:4px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:var(--blue);
    color:#fff;
    font-size:16px;
    font-weight:500;
    cursor:pointer;
}

.add-button:active{
    opacity:.85;
}

/* =========================
   添加账号弹窗
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    background:#fff;
    border-radius:20px 20px 0 0;
    padding:22px 20px 30px;
    animation:up .2s ease;
}

@keyframes up{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-title{
    font-size:20px;
    font-weight:500;
}

.close{
    width:38px;
    height:38px;
    border:0;
    background:#f1f3f4;
    border-radius:50%;
    font-size:22px;
    color:#5f6368;
}

label{
    display:block;
    font-size:13px;
    color:var(--secondary);
    margin:14px 0 7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #dadce0;
    border-radius:10px;
    outline:none;
    font-size:15px;
    background:#fff;
    color:#202124;
}

input:focus{
    border:2px solid var(--blue);
    padding:13px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.cancel,
.save{
    flex:1;
    border:0;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
}

.cancel{
    background:#f1f3f4;
    color:#3c4043;
}

.save{
    background:var(--blue);
    color:#fff;
}

.tip{
    color:#80868b;
    font-size:12px;
    line-height:1.6;
    margin-top:14px;
}

/* =========================
   Toast
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%) translateY(20px);
    background:#323232;
    color:#fff;
    padding:11px 18px;
    border-radius:8px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:380px){

    .code{
        font-size:29px;
        letter-spacing:3px;
    }

    .account{
        padding:15px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <div class="header">

        <div class="title-area">

            <div class="title">
                验证器
            </div>

            <!-- 你的 Telegram 联系方式 -->
            <a
                class="telegram-contact"
                href="https://t.me/oooky"
                target="_blank"
                rel="noopener noreferrer"
            >
                @oooky
            </a>

        </div>

        <button
            class="add-top"
            id="addTop"
            aria-label="添加账号"
        >
            ＋
        </button>

    </div>


    <!-- 内容 -->
    <div class="content">

        <div id="accounts"></div>

        <button
            class="add-button"
            id="addButton"
        >
            ＋ 添加账号
        </button>

    </div>

</div>


<!-- 添加账号弹窗 -->

<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                添加账号
            </div>

            <button
                class="close"
                id="closeBtn"
            >
                ×
            </button>

        </div>


        <label>
            账号名称
        </label>

        <input
            id="nameInput"
            type="text"
            placeholder="例如：Google"
            autocomplete="off"
        >


        <label>
            Secret Key
        </label>

        <input
            id="secretInput"
            type="text"
            placeholder="输入设置密钥"
            autocomplete="off"
            autocapitalize="characters"
        >


        <div class="actions">

            <button
                class="cancel"
                id="cancelBtn"
            >
                取消
            </button>

            <button
                class="save"
                id="saveBtn"
            >
                添加
            </button>

        </div>


        <div class="tip">
            设置密钥仅保存在当前设备本地，不上传到服务器。
        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
>
    已复制
</div>


<script>

/* =========================
   基础设置
========================= */

const STORAGE_KEY = "tg_authenticator_accounts";

let accounts = [];


/* =========================
   元素
========================= */

const accountsEl =
    document.getElementById("accounts");

const modal =
    document.getElementById("modal");

const nameInput =
    document.getElementById("nameInput");

const secretInput =
    document.getElementById("secretInput");

const toast =
    document.getElementById("toast");


/* =========================
   读取账号
========================= */

function loadAccounts(){

    try{

        const data =
            localStorage.getItem(STORAGE_KEY);

        if(data){

            const parsed =
                JSON.parse(data);

            if(Array.isArray(parsed)){

                accounts = parsed;

            }

        }

    }catch(e){

        console.error(e);

        accounts = [];

    }

    render();

}


/* =========================
   保存账号
========================= */

function saveAccounts(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );

}


/* =========================
   Base32
========================= */

function base32ToBytes(secret){

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    const clean =
        secret
        .toUpperCase()
        .replace(/[\s=-]/g,"");

    let bits = "";

    const bytes = [];

    for(let i=0;i<clean.length;i++){

        const value =
            alphabet.indexOf(clean[i]);

        if(value < 0){
            continue;
        }

        bits +=
            value
            .toString(2)
            .padStart(5,"0");

    }

    for(
        let i=0;
        i+8<=bits.length;
        i+=8
    ){

        bytes.push(
            parseInt(
                bits.slice(i,i+8),
                2
            )
        );

    }

    return new Uint8Array(bytes);

}


/* =========================
   TOTP
========================= */

async function generateTOTP(secret){

    try{

        const key =
            base32ToBytes(secret);

        if(!key.length){

            return null;

        }

        const counter =
            Math.floor(
                Date.now()/1000/30
            );

        const buffer =
            new ArrayBuffer(8);

        const view =
            new DataView(buffer);

        view.setUint32(
            0,
            Math.floor(
                counter / 4294967296
            )
        );

        view.setUint32(
            4,
            counter >>> 0
        );


        const cryptoKey =
            await crypto.subtle.importKey(
                "raw",
                key,
                {
                    name:"HMAC",
                    hash:"SHA-1"
                },
                false,
                ["sign"]
            );


        const signature =
            new Uint8Array(
                await crypto.subtle.sign(
                    "HMAC",
                    cryptoKey,
                    buffer
                )
            );


        const offset =
            signature[
                signature.length - 1
            ] & 15;


        const binary =
            (
                ((signature[offset] & 127) << 24) |
                ((signature[offset+1] & 255) << 16) |
                ((signature[offset+2] & 255) << 8) |
                (signature[offset+3] & 255)
            ) >>> 0;


        return String(
            binary % 1000000
        ).padStart(6,"0");


    }catch(e){

        console.error(e);

        return null;

    }

}


/* =========================
   HTML 安全处理
========================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   渲染账号
========================= */

function render(){

    accountsEl.innerHTML = "";


    if(accounts.length === 0){

        accountsEl.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔐
                </div>

                <div class="empty-title">
                    暂无账号
                </div>

                <div class="empty-text">
                    添加账号后，验证码会显示在这里
                </div>

            </div>

        `;

        return;

    }


    accounts.forEach(
        (account,index)=>{

            const card =
                document.createElement("div");

            card.className =
                "account";


            card.innerHTML = `

                <div class="account-name">
                    ${escapeHtml(account.name)}
                </div>

                <div class="account-secret">
                    TOTP 验证码
                </div>

                <div class="code-row">

                    <div
                        class="code"
                        id="code-${index}"
                    >
                        ------
                    </div>

                    <button
                        class="copy"
                        data-copy="${index}"
                    >
                        复制
                    </button>

                </div>


                <div class="bottom-row">

                    <div
                        class="time-text"
                        id="time-${index}"
                    >
                        --
                    </div>

                    <div class="progress">

                        <div
                            class="progress-bar"
                            id="progress-${index}"
                        ></div>

                    </div>

                    <button
                        class="delete"
                        data-delete="${index}"
                    >
                        删除
                    </button>

                </div>

            `;


            accountsEl.appendChild(card);

        }
    );


    document
        .querySelectorAll("[data-copy]")
        .forEach(button=>{

            button.addEventListener(
                "click",
                function(){

                    const index =
                        Number(
                            this.dataset.copy
                        );

                    copyCode(index);

                }
            );

        });


    document
        .querySelectorAll("[data-delete]")
        .forEach(button=>{

            button.addEventListener(
                "click",
                function(){

                    const index =
                        Number(
                            this.dataset.delete
                        );

                    deleteAccount(index);

                }
            );

        });

}


/* =========================
   更新验证码
========================= */

async function updateCodes(){

    const seconds =
        Math.floor(Date.now()/1000);

    const remaining =
        30 - (seconds % 30);

    const percent =
        (remaining / 30) * 100;


    for(
        let i=0;
        i<accounts.length;
        i++
    ){

        const code =
            await generateTOTP(
                accounts[i].secret
            );


        const codeEl =
            document.getElementById(
                `code-${i}`
            );

        const timeEl =
            document.getElementById(
                `time-${i}`
            );

        const progressEl =
            document.getElementById(
                `progress-${i}`
            );


        if(codeEl){

            codeEl.textContent =
                code || "------";

        }


        if(timeEl){

            timeEl.textContent =
                `${remaining} 秒后更新`;

        }


        if(progressEl){

            progressEl.style.width =
                `${percent}%`;

        }

    }

}


/* =========================
   打开弹窗
========================= */

function openModal(){

    modal.classList.add("show");

    nameInput.value = "";

    secretInput.value = "";

    setTimeout(
        ()=>{
            nameInput.focus();
        },
        150
    );

}


/* =========================
   关闭弹窗
========================= */

function closeModal(){

    modal.classList.remove("show");

}


/* =========================
   添加账号
========================= */

async function addAccount(){

    const name =
        nameInput.value.trim();

    const secret =
        secretInput.value
        .trim()
        .replace(/\s/g,"")
        .toUpperCase();


    if(!name){

        alert("请输入账号名称");

        nameInput.focus();

        return;

    }


    if(!secret){

        alert("请输入 Secret Key");

        secretInput.focus();

        return;

    }


    const test =
        await generateTOTP(secret);


    if(!test){

        alert(
            "Secret Key 无效，请检查设置密钥。"
        );

        return;

    }


    accounts.push({

        id:
            Date.now().toString(),

        name:name,

        secret:secret

    });


    saveAccounts();

    closeModal();

    render();

    updateCodes();

}


/* =========================
   删除账号
========================= */

function deleteAccount(index){

    if(
        !confirm(
            "确定要删除这个账号吗？"
        )
    ){

        return;

    }


    accounts.splice(index,1);

    saveAccounts();

    render();

    updateCodes();

}


/* =========================
   复制验证码
========================= */

async function copyCode(index){

    const code =
        await generateTOTP(
            accounts[index].secret
        );


    if(!code){

        return;

    }


    try{

        await navigator.clipboard.writeText(
            code
        );

        showToast("验证码已复制");

    }catch(e){

        showToast("复制失败");

    }

}


/* =========================
   Toast
========================= */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(
        ()=>{
            toast.classList.remove("show");
        },
        1500
    );

}


/* =========================
   按钮事件
========================= */

document
    .getElementById("addTop")
    .addEventListener(
        "click",
        openModal
    );


document
    .getElementById("addButton")
    .addEventListener(
        "click",
        openModal
    );


document
    .getElementById("closeBtn")
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById("cancelBtn")
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById("saveBtn")
    .addEventListener(
        "click",
        addAccount
    );


modal.addEventListener(
    "click",
    function(e){

        if(e.target === modal){

            closeModal();

        }

    }
);


/* =========================
   启动
========================= */

loadAccounts();

updateCodes();


setInterval(
    updateCodes,
    1000
);

</script>

</body>
</html>
