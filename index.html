<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>验证器</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;
  background: #f5f7fa;
  color: #202124;
}

body {
  padding-bottom: 30px;
}

.container {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 0 14px 30px;
}

/* =========================
   顶部
========================= */

.header {
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-title {
  font-size: 20px;
  font-weight: 600;
}

.add-top-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #1976d2;
  color: #ffffff;
  font-size: 27px;
  line-height: 40px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.add-top-button:active {
  transform: scale(0.92);
  opacity: 0.85;
}

/* =========================
   招商链接
========================= */

.promo-wrap {
  margin-bottom: 12px;
}

.promo-button {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #1976d2;
  border-radius: 10px;
  background: #ffffff;
  color: #1976d2;
  text-align: center;
  text-decoration: none;
  font-size: 14px;
}

/* =========================
   空状态
========================= */

.empty-state {
  text-align: center;
  padding: 46px 20px 32px;
}

.empty-icon {
  font-size: 44px;
  margin-bottom: 12px;
}

.empty-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 9px;
}

.empty-text {
  color: #7b8188;
  font-size: 14px;
  line-height: 1.7;
}

/* =========================
   账号列表
========================= */

.accounts {
  width: 100%;
}

/* =========================
   账号卡片
========================= */

.account-card {
  background: #ffffff;
  border-radius: 12px;
  margin-bottom: 9px;
  padding: 13px 15px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
}

.account-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  word-break: break-all;
}

.code-title {
  font-size: 12px;
  color: #777777;
  margin-bottom: 1px;
}

.code {
  font-size: 32px;
  line-height: 1.2;
  letter-spacing: 2px;
  font-weight: 600;
  color: #202124;
  font-variant-numeric: tabular-nums;
}

/* =========================
   复制 + 读秒
========================= */

.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 7px;
}

.copy-button {
  border: none;
  border-radius: 7px;
  background: #1976d2;
  color: #ffffff;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.copy-button:active {
  opacity: 0.8;
}

.seconds {
  font-size: 13px;
  color: #777777;
  min-width: 38px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* =========================
   删除
========================= */

.delete-button {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 7px 10px;
  border: 1px solid #e0e0e0;
  border-radius: 7px;
  background: #ffffff;
  color: #d93025;
  font-size: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.delete-button:active {
  background: #fafafa;
}

/* =========================
   添加区域
========================= */

.add-section {
  margin-top: 14px;
  padding: 16px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  scroll-margin-top: 15px;
}

.add-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 13px;
}

.input-label {
  display: block;
  font-size: 13px;
  color: #555555;
  margin-bottom: 6px;
}

.input {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid #d8dce1;
  border-radius: 8px;
  outline: none;
  font-size: 14px;
  background: #ffffff;
  margin-bottom: 12px;
}

.input:focus {
  border-color: #1976d2;
  box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.08);
}

.confirm-button {
  width: 100%;
  height: 42px;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: #ffffff;
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 9px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.confirm-button:active {
  opacity: 0.85;
}

.scan-button {
  width: 100%;
  height: 42px;
  border: 1px solid #1976d2;
  border-radius: 8px;
  background: #ffffff;
  color: #1976d2;
  font-size: 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.scan-button:active {
  background: #f5f9ff;
}

/* =========================
   Toast
========================= */

.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: rgba(32, 33, 36, 0.9);
  color: #ffffff;
  padding: 9px 15px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 9999;
  display: none;
  white-space: nowrap;
}

/* =========================
   隐藏
========================= */

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="container">

  <!-- 顶部 -->
  <div class="header">

    <div class="header-title">
      验证器
    </div>

    <button
      id="topAddButton"
      class="add-top-button"
      type="button"
      aria-label="添加账号"
    >
      ＋
    </button>

  </div>


  <!-- 官方招商 -->
  <div class="promo-wrap">

    <a
      class="promo-button"
      href="https://t.me/oooky"
      target="_blank"
      rel="noopener noreferrer"
    >
      开云体育官方招商 @oooky
    </a>

  </div>


  <!-- 空状态 -->
  <div
    id="emptyState"
    class="empty-state"
  >

    <div class="empty-icon">
      🔐
    </div>

    <div class="empty-title">
      暂无账号
    </div>

    <div class="empty-text">
      在下面输入账号信息，<br>
      或直接扫描验证器二维码
    </div>

  </div>


  <!-- 账号 -->
  <div
    id="accounts"
    class="accounts"
  ></div>


  <!-- 添加账号 -->
  <div
    id="addSection"
    class="add-section"
  >

    <div class="add-title">
      添加账号
    </div>


    <label
      class="input-label"
      for="accountName"
    >
      账号名称
    </label>

    <input
      id="accountName"
      class="input"
      type="text"
      placeholder="例如：我的账号"
      autocomplete="off"
    >


    <label
      class="input-label"
      for="secretKey"
    >
      Secret Key
    </label>

    <input
      id="secretKey"
      class="input"
      type="text"
      placeholder="输入 Secret Key"
      autocomplete="off"
      autocapitalize="characters"
    >


    <button
      id="confirmButton"
      class="confirm-button"
      type="button"
    >
      确认添加
    </button>


    <button
      id="scanButton"
      class="scan-button"
      type="button"
    >
      📷 扫码添加
    </button>

  </div>

</div>


<!-- Toast -->
<div
  id="toast"
  class="toast"
></div>


<script>

/* =========================================================
   Telegram Mini App
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {
  tg.ready();
  tg.expand();
}


/* =========================================================
   数据
========================================================= */

const STORAGE_KEY =
  "tg_authenticator_accounts";

let accounts =
  loadAccounts();


/* =========================================================
   读取账号
========================================================= */

function loadAccounts() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!data) {
      return [];
    }

    const parsed =
      JSON.parse(data);

    if (!Array.isArray(parsed)) {
      return [];
    }

    return parsed;

  } catch (error) {

    console.error(error);

    return [];
  }
}


/* =========================================================
   保存账号
========================================================= */

function saveAccounts() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(accounts)
  );
}


/* =========================================================
   HTML 安全处理
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   Base32
========================================================= */

function base32ToBytes(base32) {

  const alphabet =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

  const clean =
    String(base32)
      .toUpperCase()
      .replace(/[\s-]/g, "")
      .replace(/=+$/g, "");

  let bits = "";
  let result = [];

  for (const char of clean) {

    const index =
      alphabet.indexOf(char);

    if (index === -1) {

      throw new Error(
        "Secret Key 格式错误"
      );
    }

    bits +=
      index
        .toString(2)
        .padStart(5, "0");
  }


  for (
    let i = 0;
    i + 8 <= bits.length;
    i += 8
  ) {

    result.push(
      parseInt(
        bits.slice(i, i + 8),
        2
      )
    );
  }


  return new Uint8Array(result);
}


/* =========================================================
   TOTP
========================================================= */

async function generateTOTP(secret) {

  const keyBytes =
    base32ToBytes(secret);

  const counter =
    Math.floor(
      Date.now() / 1000 / 30
    );


  const counterBuffer =
    new ArrayBuffer(8);

  const counterView =
    new DataView(
      counterBuffer
    );


  const high =
    Math.floor(
      counter / 0x100000000
    );

  const low =
    counter >>> 0;


  counterView.setUint32(
    0,
    high
  );

  counterView.setUint32(
    4,
    low
  );


  const cryptoKey =
    await crypto.subtle.importKey(
      "raw",
      keyBytes,
      {
        name: "HMAC",
        hash: "SHA-1"
      },
      false,
      ["sign"]
    );


  const signature =
    await crypto.subtle.sign(
      "HMAC",
      cryptoKey,
      counterBuffer
    );


  const hash =
    new Uint8Array(
      signature
    );


  const offset =
    hash[hash.length - 1] &
    0x0f;


  const binary =
    ((hash[offset] & 0x7f) << 24) |
    ((hash[offset + 1] & 0xff) << 16) |
    ((hash[offset + 2] & 0xff) << 8) |
    (hash[offset + 3] & 0xff);


  const otp =
    binary % 1000000;


  return String(otp)
    .padStart(6, "0");
}


/* =========================================================
   123456 → 123 456
========================================================= */

function formatCode(code) {

  if (!/^\d{6}$/.test(code)) {
    return code;
  }

  return (
    code.slice(0, 3) +
    " " +
    code.slice(3, 6)
  );
}


/* =========================================================
   Toast
========================================================= */

let toastTimer = null;

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.style.display =
    "block";


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(() => {

      toast.style.display =
        "none";

    }, 1800);
}


/* =========================================================
   渲染账号
========================================================= */

function renderAccounts() {

  const container =
    document.getElementById(
      "accounts"
    );

  const emptyState =
    document.getElementById(
      "emptyState"
    );


  container.innerHTML =
    "";


  if (accounts.length === 0) {

    emptyState.classList
      .remove("hidden");

    return;
  }


  emptyState.classList
    .add("hidden");


  accounts.forEach(
    (account, index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "account-card";


      card.innerHTML = `

        <div class="account-name">
          ${escapeHtml(account.name)}
        </div>

        <div class="code-title">
          TOTP 验证码
        </div>

        <div
          class="code"
          id="code-${index}"
        >
          ------
        </div>

        <div class="card-bottom">

          <button
            class="copy-button"
            data-copy-index="${index}"
            type="button"
          >
            复制
          </button>

          <div
            class="seconds"
            id="seconds-${index}"
          >
            30秒
          </div>

        </div>

        <button
          class="delete-button"
          data-delete-index="${index}"
          type="button"
        >
          删除账号
        </button>

      `;


      container.appendChild(
        card
      );
    }
  );
}


/* =========================================================
   更新验证码 + 读秒
========================================================= */

async function updateCodes() {

  if (accounts.length === 0) {
    return;
  }


  const now =
    Math.floor(
      Date.now() / 1000
    );


  /*
    每 30 秒更新一次。

    30
    29
    28
    27
    ...
    2
    1
    30
  */

  const seconds =
    30 - (now % 30);


  accounts.forEach(
    async (account, index) => {

      try {

        const code =
          await generateTOTP(
            account.secret
          );


        const codeElement =
          document.getElementById(
            `code-${index}`
          );


        if (codeElement) {

          codeElement.textContent =
            formatCode(code);
        }


      } catch (error) {

        console.error(error);


        const codeElement =
          document.getElementById(
            `code-${index}`
          );


        if (codeElement) {

          codeElement.textContent =
            "错误";
        }
      }


      const secondsElement =
        document.getElementById(
          `seconds-${index}`
        );


      if (secondsElement) {

        secondsElement.textContent =
          `${seconds}秒`;
      }

    }
  );
}


/* =========================================================
   复制验证码
========================================================= */

async function copyCode(index) {

  const codeElement =
    document.getElementById(
      `code-${index}`
    );


  if (!codeElement) {
    return;
  }


  const code =
    codeElement.textContent
      .replace(/\s/g, "")
      .trim();


  if (!/^\d{6}$/.test(code)) {

    showToast(
      "验证码暂不可复制"
    );

    return;
  }


  try {

    await navigator.clipboard
      .writeText(code);

    showToast(
      "验证码已复制"
    );

  } catch (error) {

    console.error(error);

    showToast(
      "复制失败"
    );
  }
}


/* =========================================================
   删除账号
========================================================= */

function deleteAccount(index) {

  if (!accounts[index]) {
    return;
  }


  const accountName =
    accounts[index].name;


  const confirmed =
    confirm(
      `确定要删除这个账号吗？\n\n${accountName}`
    );


  if (!confirmed) {
    return;
  }


  accounts.splice(
    index,
    1
  );


  saveAccounts();

  renderAccounts();

  updateCodes();

  showToast(
    "账号已删除"
  );
}


/* =========================================================
   添加账号
========================================================= */

function addAccount() {

  const nameInput =
    document.getElementById(
      "accountName"
    );

  const secretInput =
    document.getElementById(
      "secretKey"
    );


  const name =
    nameInput.value.trim();


  const secret =
    secretInput.value
      .trim()
      .replace(/\s/g, "")
      .toUpperCase();


  if (!name) {

    showToast(
      "请输入账号名称"
    );

    nameInput.focus();

    return;
  }


  if (!secret) {

    showToast(
      "请输入 Secret Key"
    );

    secretInput.focus();

    return;
  }


  try {

    base32ToBytes(
      secret
    );

  } catch (error) {

    showToast(
      "Secret Key 格式错误"
    );

    secretInput.focus();

    return;
  }


  accounts.push({
    name: name,
    secret: secret
  });


  saveAccounts();


  nameInput.value =
    "";

  secretInput.value =
    "";


  renderAccounts();

  updateCodes();


  showToast(
    "账号添加成功"
  );
}


/* =========================================================
   解析 otpauth QR
========================================================= */

function parseOtpAuth(uri) {

  try {

    const url =
      new URL(uri);


    if (
      url.protocol.toLowerCase() !==
      "otpauth:"
    ) {
      return null;
    }


    if (
      url.host.toLowerCase() !==
      "totp"
    ) {
      return null;
    }


    const secret =
      url.searchParams.get(
        "secret"
      );


    if (!secret) {
      return null;
    }


    let name =
      decodeURIComponent(
        url.pathname
          .replace(/^\/+/, "")
      );


    const issuer =
      url.searchParams.get(
        "issuer"
      );


    if (!name) {

      name =
        issuer ||
        "新账号";
    }


    return {

      name: name,

      secret: secret
        .replace(/\s/g, "")
        .toUpperCase()

    };


  } catch (error) {

    console.error(error);

    return null;
  }
}


/* =========================================================
   扫码
========================================================= */

function scanQrCode() {

  if (
    !tg ||
    typeof tg.showScanQrPopup !==
      "function"
  ) {

    showToast(
      "当前环境不支持扫码"
    );

    return;
  }


  tg.showScanQrPopup(
    {
      text:
        "扫描验证器二维码"
    },

    function(text) {

      const result =
        parseOtpAuth(text);


      if (!result) {

        showToast(
          "二维码格式不正确"
        );

        return true;
      }


      try {

        base32ToBytes(
          result.secret
        );

      } catch (error) {

        showToast(
          "Secret Key 无效"
        );

        return true;
      }


      accounts.push({

        name: result.name,

        secret: result.secret

      });


      saveAccounts();

      renderAccounts();

      updateCodes();


      showToast(
        "扫码添加成功"
      );


      return true;
    }
  );
}


/* =========================================================
   右上角 +
========================================================= */

function scrollToAdd() {

  const section =
    document.getElementById(
      "addSection"
    );

  const input =
    document.getElementById(
      "accountName"
    );


  if (!section) {
    return;
  }


  /*
    滚动到添加账号区域
  */

  section.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });


  /*
    自动聚焦账号名称
  */

  setTimeout(
    () => {

      if (input) {

        input.focus();

      }

    },
    500
  );
}


/* =========================================================
   顶部 + 点击事件
========================================================= */

const topAddButton =
  document.getElementById(
    "topAddButton"
  );


if (topAddButton) {

  topAddButton.addEventListener(
    "click",
    scrollToAdd
  );


  /*
    同时兼容手机触摸
  */

  topAddButton.addEventListener(
    "touchend",
    function(event) {

      event.preventDefault();

      scrollToAdd();

    },
    {
      passive: false
    }
  );
}


/* =========================================================
   确认添加
========================================================= */

document
  .getElementById(
    "confirmButton"
  )
  .addEventListener(
    "click",
    addAccount
  );


/* =========================================================
   扫码
========================================================= */

document
  .getElementById(
    "scanButton"
  )
  .addEventListener(
    "click",
    scanQrCode
  );


/* =========================================================
   Secret Key 回车
========================================================= */

document
  .getElementById(
    "secretKey"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        addAccount();

      }

    }
  );


/* =========================================================
   复制 / 删除
========================================================= */

document
  .getElementById(
    "accounts"
  )
  .addEventListener(
    "click",
    function(event) {

      const copyButton =
        event.target.closest(
          "[data-copy-index]"
        );


      if (copyButton) {

        const index =
          Number(
            copyButton.dataset
              .copyIndex
          );


        copyCode(index);

        return;
      }


      const deleteButton =
        event.target.closest(
          "[data-delete-index]"
        );


      if (deleteButton) {

        const index =
          Number(
            deleteButton.dataset
              .deleteIndex
          );


        deleteAccount(index);

        return;
      }

    }
  );


/* =========================================================
   初始化
========================================================= */

renderAccounts();

updateCodes();


/* =========================================================
   每秒更新读秒
========================================================= */

setInterval(
  function() {

    updateCodes();

  },
  1000
);

</script>

</body>
</html>
