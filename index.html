<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>验证器</title>

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#f6f7f9;
    --card:#ffffff;
    --text:#202124;
    --sub:#6b7280;
    --line:#e5e7eb;
    --blue:#4285f4;
    --danger:#ea4335;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:var(--bg);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Roboto",
        "Helvetica Neue",
        Arial,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    color:var(--text);
}

body{
    padding-bottom:30px;
}


/* =========================
   顶部
========================= */

.header{

    height:70px;

    background:#ffffff;

    border-bottom:1px solid var(--line);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 14px;

    position:sticky;

    top:0;

    z-index:20;
}


/* 左侧占位 */

.header-side{

    width:44px;

    height:44px;
}


/* =========================
   顶部中间
   开云体育官方招商 @oooky
========================= */

.招商链接{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    display:block;

    color:#202124;

    text-decoration:none;

    font-size:15px;

    font-weight:600;

    white-space:nowrap;

    padding:8px 12px;

    border-radius:8px;

    transition:.15s;
}

.招商链接:active{

    opacity:.65;

    background:#f1f3f4;
}


/* =========================
   右上角添加
========================= */

.add-top{

    margin-left:auto;

    width:44px;

    height:44px;

    border:0;

    border-radius:50%;

    background:transparent;

    color:#333;

    font-size:30px;

    font-weight:300;

    line-height:44px;

    padding:0;

    cursor:pointer;
}

.add-top:active{

    background:#f0f0f0;
}


/* =========================
   主体
========================= */

.container{

    width:100%;

    max-width:620px;

    margin:0 auto;

    padding:18px 14px 30px;
}


/* =========================
   空状态
========================= */

.empty{

    text-align:center;

    padding:80px 20px;

    color:var(--sub);
}

.empty-icon{

    font-size:48px;

    margin-bottom:15px;
}

.empty-title{

    font-size:18px;

    color:#333;

    margin-bottom:8px;
}

.empty-text{

    font-size:14px;

    line-height:22px;
}


/* =========================
   验证器卡片
========================= */

.account-card{

    background:var(--card);

    border:1px solid var(--line);

    border-radius:16px;

    margin-bottom:14px;

    padding:18px 18px 14px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.04);
}


/* 账号顶部 */

.account-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:8px;
}


/* 账号名称 */

.account-name{

    font-size:15px;

    font-weight:500;

    color:#333;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    padding-right:10px;
}


/* 删除 */

.delete-btn{

    border:0;

    background:transparent;

    color:#999;

    font-size:13px;

    padding:5px 3px;

    cursor:pointer;
}

.delete-btn:active{

    color:var(--danger);
}


/* =========================
   验证码
========================= */

.code{

    font-size:38px;

    letter-spacing:5px;

    font-weight:600;

    color:#202124;

    line-height:48px;

    font-variant-numeric:tabular-nums;

    user-select:text;

    cursor:pointer;
}


/* 提示 */

.code-hint{

    font-size:12px;

    color:#999;

    margin-top:2px;
}


/* =========================
   复制按钮
========================= */

.copy-btn{

    margin-top:12px;

    width:100%;

    height:40px;

    border:0;

    border-radius:9px;

    background:#f1f3f4;

    color:#3c4043;

    font-size:14px;

    cursor:pointer;
}

.copy-btn:active{

    background:#e5e7e9;
}


/* =========================
   倒计时
========================= */

.timer-row{

    display:flex;

    align-items:center;

    gap:9px;

    margin-top:14px;
}

.timer-text{

    width:28px;

    text-align:right;

    font-size:12px;

    color:#777;

    font-variant-numeric:tabular-nums;
}

.progress{

    flex:1;

    height:4px;

    border-radius:10px;

    background:#e9eaec;

    overflow:hidden;
}

.progress-bar{

    height:100%;

    width:100%;

    background:var(--blue);

    border-radius:10px;

    transition:width:.2s linear;
}


/* =========================
   添加账号弹窗
========================= */

.modal-mask{

    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:rgba(0,0,0,.42);

    align-items:flex-end;

    justify-content:center;
}

.modal-mask.show{

    display:flex;
}


/* 弹窗 */

.modal{

    width:100%;

    max-width:620px;

    background:#fff;

    border-radius:20px 20px 0 0;

    padding:22px 18px 30px;

    animation:slideUp .22s ease;
}


/* 弹出动画 */

@keyframes slideUp{

    from{

        transform:translateY(100%);
    }

    to{

        transform:translateY(0);
    }
}


/* 弹窗标题 */

.modal-title{

    font-size:19px;

    font-weight:600;

    margin-bottom:20px;
}


/* 输入框 */

.input-group{

    margin-bottom:14px;
}

.input-label{

    display:block;

    font-size:13px;

    color:#666;

    margin-bottom:7px;
}

.input{

    width:100%;

    height:46px;

    border:1px solid #dadce0;

    border-radius:9px;

    padding:0 13px;

    outline:none;

    font-size:15px;

    color:#222;

    background:#fff;
}

.input:focus{

    border-color:var(--blue);

    box-shadow:
        0 0 0 2px rgba(66,133,244,.12);
}


/* =========================
   弹窗按钮
========================= */

.modal-actions{

    display:flex;

    gap:10px;

    margin-top:20px;
}

.cancel-btn,
.save-btn{

    flex:1;

    height:46px;

    border-radius:9px;

    font-size:15px;

    cursor:pointer;
}

.cancel-btn{

    border:1px solid #ddd;

    background:#fff;

    color:#555;
}

.save-btn{

    border:0;

    background:var(--blue);

    color:#fff;
}

.save-btn:active{

    opacity:.85;
}


/* =========================
   Toast提示
========================= */

.toast{

    position:fixed;

    left:50%;

    bottom:35px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:rgba(32,33,36,.92);

    color:#fff;

    padding:9px 16px;

    border-radius:20px;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:200;

    white-space:nowrap;
}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================
   手机适配
========================= */

@media(max-width:420px){

    .code{

        font-size:34px;

        letter-spacing:4px;
    }

    .招商链接{

        font-size:14px;

        padding:8px 6px;
    }

    .header{

        height:68px;
    }
}

</style>
</head>


<body>


<!-- =========================
     顶部
========================= -->

<header class="header">


    <!-- 左边占位 -->

    <div class="header-side"></div>


    <!--
        顶部中间招商文字

        点击后跳转：
        https://t.me/oooky
    -->

    <a
        class="招商链接"
        href="https://t.me/oooky"
        target="_blank"
        rel="noopener noreferrer"
    >
        开云体育官方招商 @oooky
    </a>


    <!-- 右上角添加账号 -->

    <button
        class="add-top"
        id="addTop"
        aria-label="添加账号"
    >
        ＋
    </button>


</header>



<!-- =========================
     主体
========================= -->

<main class="container">


    <!-- 账号列表 -->

    <div id="accountList"></div>


    <!-- 没有账号时 -->

    <div
        class="empty"
        id="emptyState"
    >

        <div class="empty-icon">
            🔐
        </div>

        <div class="empty-title">
            暂无验证账号
        </div>

        <div class="empty-text">
            点击右上角「＋」添加你的验证账号
        </div>

    </div>


</main>



<!-- =========================
     添加账号弹窗
========================= -->

<div
    class="modal-mask"
    id="modalMask"
>


    <div class="modal">


        <div class="modal-title">
            添加验证账号
        </div>


        <!-- 账号名称 -->

        <div class="input-group">

            <label class="input-label">
                账号名称
            </label>

            <input
                class="input"
                id="accountName"
                type="text"
                placeholder="例如：Google"
                autocomplete="off"
            >

        </div>


        <!-- Secret Key -->

        <div class="input-group">

            <label class="input-label">
                Secret Key
            </label>

            <input
                class="input"
                id="secretKey"
                type="text"
                placeholder="输入验证器密钥"
                autocomplete="off"
                autocapitalize="characters"
            >

        </div>


        <!-- 按钮 -->

        <div class="modal-actions">


            <button
                class="cancel-btn"
                id="cancelBtn"
            >
                取消
            </button>


            <button
                class="save-btn"
                id="saveBtn"
            >
                添加账号
            </button>


        </div>


    </div>

</div>



<!-- =========================
     Toast
========================= -->

<div
    class="toast"
    id="toast"
></div>



<script>

/* ==========================================
   本地存储
========================================== */

const STORAGE_KEY =
    "tg_authenticator_accounts";

let accounts = [];


try{

    accounts =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"
        );

    if(!Array.isArray(accounts)){

        accounts = [];

    }

}catch(e){

    accounts = [];

}


/* ==========================================
   Base32 解码
========================================== */

function base32ToBytes(base32){

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    const clean =
        String(base32)
        .toUpperCase()
        .replace(/[\s=-]/g,"");

    let bits = "";

    let output = [];


    for(const char of clean){

        const value =
            alphabet.indexOf(char);


        if(value === -1){

            continue;

        }


        bits +=
            value
            .toString(2)
            .padStart(5,"0");

    }


    for(
        let i = 0;
        i + 8 <= bits.length;
        i += 8
    ){

        output.push(

            parseInt(
                bits.slice(i,i+8),
                2
            )

        );

    }


    return new Uint8Array(output);

}


/* ==========================================
   HMAC-SHA1
========================================== */

async function hmacSha1(
    keyBytes,
    messageBytes
){

    const key =
        await crypto.subtle.importKey(

            "raw",

            keyBytes,

            {
                name:"HMAC",
                hash:"SHA-1"
            },

            false,

            ["sign"]

        );


    return new Uint8Array(

        await crypto.subtle.sign(

            "HMAC",

            key,

            messageBytes

        )

    );

}


/* ==========================================
   生成 TOTP
========================================== */

async function generateTOTP(secret){

    try{

        const key =
            base32ToBytes(secret);


        if(!key.length){

            return "------";

        }


        const counter =
            Math.floor(
                Date.now() / 1000 / 30
            );


        const buffer =
            new ArrayBuffer(8);


        const view =
            new DataView(buffer);


        view.setUint32(

            0,

            Math.floor(
                counter / 0x100000000
            )

        );


        view.setUint32(

            4,

            counter >>> 0

        );


        const hash =
            await hmacSha1(

                key,

                new Uint8Array(buffer)

            );


        const offset =
            hash[
                hash.length - 1
            ] & 0x0f;


        const binary =

            ((hash[offset] & 0x7f) << 24) |

            ((hash[offset + 1] & 0xff) << 16) |

            ((hash[offset + 2] & 0xff) << 8) |

            (hash[offset + 3] & 0xff);


        return String(

            binary % 1000000

        ).padStart(6,"0");


    }catch(e){

        console.error(e);

        return "------";

    }

}


/* ==========================================
   保存账号
========================================== */

function saveAccounts(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(accounts)

    );

}


/* ==========================================
   Toast
========================================== */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(

            ()=>{

                toast.classList.remove(
                    "show"
                );

            },

            1600

        );

}


/* ==========================================
   HTML安全处理
========================================== */

function escapeHtml(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   渲染账号
========================================== */

async function renderAccounts(){

    const list =
        document.getElementById(
            "accountList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    list.innerHTML = "";


    if(accounts.length === 0){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    for(
        let i = 0;
        i < accounts.length;
        i++
    ){

        const account =
            accounts[i];


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "account-card";


        card.innerHTML = `

            <div class="account-top">

                <div class="account-name">

                    ${escapeHtml(
                        account.name
                    )}

                </div>


                <button
                    class="delete-btn"
                    data-index="${i}"
                >
                    删除
                </button>

            </div>


            <div
                class="code"
                id="code-${i}"
                data-index="${i}"
            >
                ------
            </div>


            <div class="code-hint">

                点击验证码即可复制

            </div>


            <button
                class="copy-btn"
                data-index="${i}"
            >
                复制验证码
            </button>


            <div class="timer-row">


                <div
                    class="timer-text"
                    id="timer-${i}"
                >
                    30
                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progress-${i}"
                    ></div>

                </div>


            </div>

        `;


        list.appendChild(card);

    }


    bindAccountButtons();


    await updateCodes();

}


/* ==========================================
   绑定按钮
========================================== */

function bindAccountButtons(){


    /* 删除 */

    document
        .querySelectorAll(
            ".delete-btn"
        )
        .forEach(btn=>{

            btn.addEventListener(

                "click",

                ()=>{

                    const index =
                        Number(
                            btn.dataset.index
                        );


                    deleteAccount(
                        index
                    );

                }

            );

        });



    /* 复制按钮 */

    document
        .querySelectorAll(
            ".copy-btn"
        )
        .forEach(btn=>{

            btn.addEventListener(

                "click",

                ()=>{

                    const index =
                        Number(
                            btn.dataset.index
                        );


                    copyCode(
                        index
                    );

                }

            );

        });



    /* 点击验证码复制 */

    document
        .querySelectorAll(
            ".code"
        )
        .forEach(code=>{

            code.addEventListener(

                "click",

                ()=>{

                    const index =
                        Number(
                            code.dataset.index
                        );


                    copyCode(
                        index
                    );

                }

            );

        });

}


/* ==========================================
   更新验证码
========================================== */

async function updateCodes(){


    const now =
        Math.floor(
            Date.now() / 1000
        );


    const remaining =
        30 - (now % 30);


    const percent =
        (remaining / 30) * 100;


    for(
        let i = 0;
        i < accounts.length;
        i++
    ){

        const code =
            await generateTOTP(

                accounts[i].secret

            );


        const codeElement =
            document.getElementById(
                `code-${i}`
            );


        const timerElement =
            document.getElementById(
                `timer-${i}`
            );


        const progressElement =
            document.getElementById(
                `progress-${i}`
            );


        if(codeElement){

            codeElement.textContent =

                code.slice(0,3) +
                " " +
                code.slice(3);

        }


        if(timerElement){

            timerElement.textContent =
                remaining;

        }


        if(progressElement){

            progressElement.style.width =
                percent + "%";

        }

    }

}


/* ==========================================
   删除账号
========================================== */

function deleteAccount(index){


    if(!accounts[index]){

        return;

    }


    const ok =
        confirm(
            "确定要删除这个验证账号吗？"
        );


    if(!ok){

        return;

    }


    accounts.splice(
        index,
        1
    );


    saveAccounts();


    renderAccounts();


    showToast(
        "账号已删除"
    );

}


/* ==========================================
   复制验证码
========================================== */

async function copyCode(index){


    if(!accounts[index]){

        return;

    }


    const code =
        await generateTOTP(

            accounts[index].secret

        );


    if(
        !code ||
        code === "------"
    ){

        showToast(
            "验证码生成失败"
        );

        return;

    }


    try{

        await navigator.clipboard.writeText(
            code
        );


        showToast(
            "验证码已复制"
        );


    }catch(e){


        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            code;


        textarea.style.position =
            "fixed";


        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        showToast(
            "验证码已复制"
        );

    }

}


/* ==========================================
   弹窗
========================================== */

const modalMask =
    document.getElementById(
        "modalMask"
    );


const accountName =
    document.getElementById(
        "accountName"
    );


const secretKey =
    document.getElementById(
        "secretKey"
    );


/* 打开 */

function openModal(){

    modalMask.classList.add(
        "show"
    );


    setTimeout(

        ()=>{

            accountName.focus();

        },

        100

    );

}


/* 关闭 */

function closeModal(){

    modalMask.classList.remove(
        "show"
    );


    accountName.value =
        "";


    secretKey.value =
        "";

}


/* ==========================================
   添加按钮
========================================== */

document
    .getElementById(
        "addTop"
    )
    .addEventListener(

        "click",

        openModal

    );


/* ==========================================
   取消
========================================== */

document
    .getElementById(
        "cancelBtn"
    )
    .addEventListener(

        "click",

        closeModal

    );


/* ==========================================
   点击遮罩关闭
========================================== */

modalMask.addEventListener(

    "click",

    event=>{

        if(
            event.target ===
            modalMask
        ){

            closeModal();

        }

    }

);


/* ==========================================
   添加账号
========================================== */

document
    .getElementById(
        "saveBtn"
    )
    .addEventListener(

        "click",

        async ()=>{


            const name =
                accountName.value.trim();


            const secret =
                secretKey.value
                    .trim()
                    .replace(/\s/g,"")
                    .toUpperCase();


            /* 名称 */

            if(!name){

                showToast(
                    "请输入账号名称"
                );


                accountName.focus();


                return;

            }


            /* Secret Key */

            if(!secret){

                showToast(
                    "请输入 Secret Key"
                );


                secretKey.focus();


                return;

            }


            /* 检查密钥 */

            const bytes =
                base32ToBytes(
                    secret
                );


            if(!bytes.length){

                showToast(
                    "Secret Key 格式不正确"
                );


                return;

            }


            /* 测试验证码 */

            const testCode =
                await generateTOTP(
                    secret
                );


            if(
                !testCode ||
                testCode === "------"
            ){

                showToast(
                    "Secret Key 无法生成验证码"
                );


                return;

            }


            /* 添加 */

            accounts.push({

                id:
                    Date.now().toString(),

                name:
                    name,

                secret:
                    secret

            });


            /* 保存 */

            saveAccounts();


            /* 关闭 */

            closeModal();


            /* 刷新 */

            await renderAccounts();


            showToast(
                "账号添加成功"
            );

        }

    );


/* ==========================================
   每秒更新验证码
========================================== */

setInterval(

    updateCodes,

    1000

);


/* ==========================================
   启动
========================================== */

renderAccounts();

</script>

</body>
</html>
