<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>验证器</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
            background: #f5f5f5;
            color: #202124;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f5f5f5;
        }

        /* 顶部 */
        .header {
            height: 62px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-title {
            font-size: 21px;
            font-weight: 500;
            color: #202124;
        }

        .header-plus {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border: 0;
            background: transparent;
            color: #1a73e8;
            font-size: 30px;
            line-height: 40px;
            padding: 0;
            cursor: pointer;
        }

        /* 顶部推广链接 */
        .official-link {
            display: block;
            text-align: center;
            padding: 13px 15px 12px;
            background: #ffffff;
            color: #1a73e8;
            text-decoration: none;
            font-size: 15px;
            border-bottom: 1px solid #eeeeee;
        }

        /* 内容 */
        .content {
            padding: 16px;
            padding-bottom: 35px;
        }

        /* 账号卡片 */
        .account-card {
            background: #ffffff;
            border-radius: 14px;
            margin-bottom: 14px;
            padding: 18px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .account-name {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .code-title {
            font-size: 13px;
            color: #80868b;
            margin-bottom: 4px;
        }

        .code {
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #202124;
            line-height: 1.25;
            font-variant-numeric: tabular-nums;
        }

        .card-bottom {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .copy-button {
            border: 0;
            background: #f1f3f4;
            color: #1a73e8;
            border-radius: 8px;
            padding: 8px 13px;
            font-size: 14px;
            cursor: pointer;
        }

        .copy-button:active {
            background: #e8eaed;
        }

        .progress-wrap {
            flex: 1;
            height: 5px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: #1a73e8;
            transform-origin: left center;
        }

        .seconds {
            min-width: 27px;
            text-align: right;
            font-size: 13px;
            color: #80868b;
        }

        .delete-button {
            margin-top: 13px;
            border: 0;
            background: transparent;
            color: #d93025;
            font-size: 13px;
            padding: 0;
            cursor: pointer;
        }

        /* 空状态 */
        .empty {
            text-align: center;
            padding: 38px 20px;
            color: #80868b;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .empty-title {
            font-size: 17px;
            color: #5f6368;
            margin-bottom: 6px;
        }

        .empty-text {
            font-size: 14px;
            line-height: 1.6;
        }

        /* 添加区域 */
        .add-form {
            background: #ffffff;
            border-radius: 14px;
            padding: 18px;
            margin-top: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            scroll-margin-top: 80px;
        }

        .add-form-title {
            font-size: 19px;
            font-weight: 500;
            color: #202124;
            margin-bottom: 5px;
        }

        .add-form-tip {
            color: #80868b;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 7px;
        }

        .form-input {
            width: 100%;
            height: 48px;
            border: 1px solid #dadce0;
            border-radius: 9px;
            background: #ffffff;
            outline: none;
            padding: 0 13px;
            font-size: 16px;
            color: #202124;
            margin-bottom: 16px;
        }

        .form-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 1px #1a73e8;
        }

        .form-input::placeholder {
            color: #a0a4a8;
        }

        /* 扫码按钮 */
        .scan-button {
            width: 100%;
            height: 48px;
            border-radius: 9px;
            border: 1px solid #1a73e8;
            background: #ffffff;
            color: #1a73e8;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }

        .scan-button:active {
            background: #f0f6ff;
        }

        /* 提示 */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(32, 33, 36, 0.92);
            color: #ffffff;
            padding: 10px 17px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 420px) {
            .content {
                padding: 12px;
            }

            .code {
                font-size: 31px;
                letter-spacing: 3px;
            }

            .header-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <div class="header">
        <div class="header-title">验证器</div>

        <!-- 顶部 + -->
        <button
            class="header-plus"
            id="addTop"
            aria-label="添加账号"
        >＋</button>
    </div>

    <!-- 官方链接 -->
    <a
        class="official-link"
        href="https://t.me/oooky"
        target="_blank"
        rel="noopener noreferrer"
    >
        开云体育官方招商 @oooky
    </a>

    <div class="content">

        <!-- 账号列表 -->
        <div id="accounts"></div>

        <!-- 没有账号 -->
        <div class="empty" id="emptyState">
            <div class="empty-icon">🔐</div>

            <div class="empty-title">
                暂无账号
            </div>

            <div class="empty-text">
                在下面输入账号信息，<br>
                或直接扫描验证器二维码
            </div>
        </div>

        <!-- 首页直接添加 -->
        <div class="add-form" id="addForm">

            <div class="add-form-title">
                添加账号
            </div>

            <div class="add-form-tip">
                设置密钥仅保存在当前设备本地，不上传到服务器。
            </div>

            <label
                class="form-label"
                for="nameInput"
            >
                账号名称
            </label>

            <input
                class="form-input"
                id="nameInput"
                type="text"
                autocomplete="off"
                placeholder="例如：Google"
            >

            <label
                class="form-label"
                for="secretInput"
            >
                Secret Key
            </label>

            <input
                class="form-input"
                id="secretInput"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="输入设置密钥"
            >

            <!-- 只保留扫码按钮 -->
            <button
                class="scan-button"
                id="scanButton"
                type="button"
            >
                📷 扫码添加
            </button>

        </div>

    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>


<script>
/* =========================================================
   Telegram Mini App
========================================================= */

const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================================================
   本地数据
========================================================= */

const STORAGE_KEY = "tg_authenticator_accounts";

let accounts = [];

try {
    accounts = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );
} catch (error) {
    accounts = [];
}


/* =========================================================
   DOM
========================================================= */

const accountsEl = document.getElementById("accounts");
const emptyState = document.getElementById("emptyState");
const nameInput = document.getElementById("nameInput");
const secretInput = document.getElementById("secretInput");
const addForm = document.getElementById("addForm");
const addTop = document.getElementById("addTop");
const scanButton = document.getElementById("scanButton");
const toast = document.getElementById("toast");


/* =========================================================
   Toast
========================================================= */

let toastTimer = null;

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 1800);
}


/* =========================================================
   Base32
========================================================= */

function base32ToBytes(base32) {

    const clean = base32
        .toUpperCase()
        .replace(/[\s-]/g, "")
        .replace(/=+$/, "");

    if (!clean) {
        throw new Error("Secret Key 不能为空");
    }

    if (!/^[A-Z2-7]+$/.test(clean)) {
        throw new Error("Secret Key 格式不正确");
    }

    let bits = "";
    let output = [];

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    for (const char of clean) {

        const value = alphabet.indexOf(char);

        if (value === -1) {
            throw new Error("Secret Key 格式不正确");
        }

        bits += value
            .toString(2)
            .padStart(5, "0");
    }

    for (
        let i = 0;
        i + 8 <= bits.length;
        i += 8
    ) {
        output.push(
            parseInt(
                bits.slice(i, i + 8),
                2
            )
        );
    }

    return new Uint8Array(output);
}


/* =========================================================
   TOTP
========================================================= */

async function generateTOTP(secret) {

    const keyBytes = base32ToBytes(secret);

    const counter = Math.floor(
        Date.now() / 1000 / 30
    );

    const buffer = new ArrayBuffer(8);
    const view = new DataView(buffer);

    view.setUint32(
        0,
        Math.floor(counter / 0x100000000)
    );

    view.setUint32(
        4,
        counter >>> 0
    );

    const cryptoKey = await crypto.subtle.importKey(
        "raw",
        keyBytes,
        {
            name: "HMAC",
            hash: "SHA-1"
        },
        false,
        ["sign"]
    );

    const signature = await crypto.subtle.sign(
        "HMAC",
        cryptoKey,
        buffer
    );

    const bytes = new Uint8Array(signature);

    const offset =
        bytes[bytes.length - 1] & 15;

    const binary =
        ((bytes[offset] & 127) << 24) |
        ((bytes[offset + 1] & 255) << 16) |
        ((bytes[offset + 2] & 255) << 8) |
        (bytes[offset + 3] & 255);

    return String(
        binary % 1000000
    ).padStart(6, "0");
}


/* =========================================================
   保存
========================================================= */

function saveAccounts() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );
}


/* =========================================================
   转义 HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   显示账号
========================================================= */

function renderAccounts() {

    accountsEl.innerHTML = "";

    if (accounts.length === 0) {

        emptyState.style.display = "block";

        return;
    }

    emptyState.style.display = "none";

    accounts.forEach((account, index) => {

        const card = document.createElement("div");

        card.className = "account-card";

        card.innerHTML = `
            <div class="account-name">
                ${escapeHtml(account.name)}
            </div>

            <div class="code-title">
                TOTP 验证码
            </div>

            <div
                class="code"
                id="code-${index}"
            >
                ------
            </div>

            <div class="card-bottom">

                <button
                    class="copy-button"
                    data-copy-index="${index}"
                    type="button"
                >
                    复制
                </button>

                <div class="progress-wrap">
                    <div
                        class="progress-bar"
                        id="progress-${index}"
                    ></div>
                </div>

                <div
                    class="seconds"
                    id="seconds-${index}"
                >
                    30
                </div>

            </div>

            <button
                class="delete-button"
                data-delete-index="${index}"
                type="button"
            >
                删除账号
            </button>
        `;

        accountsEl.appendChild(card);
    });


    /* 复制 */
    document
        .querySelectorAll("[data-copy-index]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const index =
                        Number(
                            button.dataset.copyIndex
                        );

                    copyCode(index);
                }
            );
        });


    /* 删除 */
    document
        .querySelectorAll("[data-delete-index]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const index =
                        Number(
                            button.dataset.deleteIndex
                        );

                    deleteAccount(index);
                }
            );
        });
}


/* =========================================================
   更新验证码
========================================================= */

async function updateCodes() {

    const seconds =
        30 - (
            Math.floor(Date.now() / 1000) % 30
        );

    const progress =
        seconds / 30 * 100;


    accounts.forEach(
        async (account, index) => {

            try {

                const code =
                    await generateTOTP(
                        account.secret
                    );

                const codeEl =
                    document.getElementById(
                        `code-${index}`
                    );

                if (codeEl) {
                    codeEl.textContent = code;
                }

            } catch (error) {

                const codeEl =
                    document.getElementById(
                        `code-${index}`
                    );

                if (codeEl) {
                    codeEl.textContent = "错误";
                }
            }

            const progressEl =
                document.getElementById(
                    `progress-${index}`
                );

            const secondsEl =
                document.getElementById(
                    `seconds-${index}`
                );

            if (progressEl) {
                progressEl.style.width =
                    `${progress}%`;
            }

            if (secondsEl) {
                secondsEl.textContent =
                    seconds;
            }
        }
    );
}


/* =========================================================
   复制验证码
========================================================= */

async function copyCode(index) {

    const codeEl =
        document.getElementById(
            `code-${index}`
        );

    if (!codeEl) {
        return;
    }

    const code =
        codeEl.textContent.trim();

    if (!/^\d{6}$/.test(code)) {

        showToast("验证码暂不可复制");

        return;
    }

    try {

        await navigator.clipboard.writeText(code);

        showToast("验证码已复制");

    } catch (error) {

        showToast("复制失败");
    }
}


/* =========================================================
   删除账号
========================================================= */

function deleteAccount(index) {

    if (
        !confirm(
            "确定要删除这个账号吗？"
        )
    ) {
        return;
    }

    accounts.splice(index, 1);

    saveAccounts();

    renderAccounts();

    updateCodes();

    showToast("账号已删除");
}


/* =========================================================
   手动添加账号
========================================================= */

async function addAccount() {

    const name =
        nameInput.value.trim();

    const secret =
        secretInput.value
            .trim()
            .replace(/\s+/g, "")
            .toUpperCase();

    if (!name) {

        showToast("请输入账号名称");

        nameInput.focus();

        return;
    }

    if (!secret) {

        showToast("请输入 Secret Key");

        secretInput.focus();

        return;
    }

    try {

        /*
         * 先验证 Secret Key
         */
        await generateTOTP(secret);

    } catch (error) {

        showToast(
            error.message ||
            "Secret Key 格式不正确"
        );

        secretInput.focus();

        return;
    }


    /*
     * 检查重复
     */
    const exists =
        accounts.some(
            account =>
                account.secret === secret
        );

    if (exists) {

        showToast("这个账号已经添加");

        return;
    }


    accounts.push({
        id: Date.now().toString(),
        name: name,
        secret: secret
    });

    saveAccounts();

    nameInput.value = "";
    secretInput.value = "";

    renderAccounts();

    updateCodes();

    showToast("账号添加成功");


    /*
     * 添加成功后滚动到验证码
     */
    setTimeout(() => {

        if (accountsEl) {

            accountsEl.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

    }, 100);
}


/* =========================================================
   解析 otpauth:// 二维码
========================================================= */

function parseOtpAuthUri(uri) {

    try {

        if (
            typeof uri !== "string" ||
            !uri.toLowerCase().startsWith(
                "otpauth://"
            )
        ) {
            return null;
        }

        const url = new URL(uri);

        if (
            url.protocol.toLowerCase() !==
            "otpauth:"
        ) {
            return null;
        }

        if (
            url.hostname.toLowerCase() !==
            "totp"
        ) {
            return null;
        }

        const secret =
            url.searchParams
                .get("secret");

        if (!secret) {
            return null;
        }

        const cleanSecret =
            secret
                .replace(/\s+/g, "")
                .toUpperCase();

        /*
         * 验证 Secret
         */
        base32ToBytes(cleanSecret);


        let label = "";

        try {

            label =
                decodeURIComponent(
                    url.pathname
                        .replace(/^\/+/, "")
                );

        } catch (error) {

            label =
                url.pathname
                    .replace(/^\/+/, "");
        }


        if (!label) {

            label =
                url.searchParams.get(
                    "issuer"
                ) || "新账号";
        }


        /*
         * 如果二维码格式：
         * Issuer:Account
         * 则优先显示 Account
         */
        if (label.includes(":")) {

            const parts =
                label.split(":");

            const accountName =
                parts
                    .slice(1)
                    .join(":")
                    .trim();

            if (accountName) {
                label = accountName;
            }
        }

        return {
            name: label,
            secret: cleanSecret
        };

    } catch (error) {

        return null;
    }
}


/* =========================================================
   扫码添加
========================================================= */

function startScan() {

    /*
     * 必须在 Telegram Mini App 中使用
     */
    if (!tg) {

        showToast(
            "请在 Telegram Mini App 中使用扫码功能"
        );

        return;
    }


    if (
        typeof tg.showScanQrPopup !==
        "function"
    ) {

        showToast(
            "当前 Telegram 不支持扫码功能"
        );

        return;
    }


    tg.showScanQrPopup(
        {
            text: "请扫描验证器二维码"
        },

        function (text) {

            const data =
                parseOtpAuthUri(text);

            if (!data) {

                showToast(
                    "请扫描有效的 TOTP 验证器二维码"
                );

                /*
                 * false = 继续扫码
                 */
                return false;
            }


            /*
             * 检查重复
             */
            const exists =
                accounts.some(
                    account =>
                        account.secret ===
                        data.secret
                );

            if (exists) {

                showToast(
                    "这个账号已经添加"
                );

                return true;
            }


            accounts.push({
                id: Date.now().toString(),
                name: data.name,
                secret: data.secret
            });

            saveAccounts();

            renderAccounts();

            updateCodes();

            showToast(
                "扫码添加成功"
            );


            /*
             * true = 关闭扫码窗口
             */
            return true;
        }
    );
}


/* =========================================================
   顶部 + 按钮
========================================================= */

function focusAddForm() {

    addForm.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

    setTimeout(() => {

        nameInput.focus();

    }, 400);
}


/* =========================================================
   事件
========================================================= */

addTop.addEventListener(
    "click",
    focusAddForm
);

scanButton.addEventListener(
    "click",
    startScan
);


/*
 * Secret Key 输入时自动大写
 */
secretInput.addEventListener(
    "input",
    () => {

        secretInput.value =
            secretInput.value
                .toUpperCase();
    }
);


/*
 * Enter 添加账号
 * 注意：虽然页面没有“添加账号”按钮，
 * 仍然可以按 Enter 快速添加。
 */
secretInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            addAccount();
        }
    }
);


/* =========================================================
   初始化
========================================================= */

renderAccounts();

updateCodes();


/*
 * 每秒刷新验证码
 */
setInterval(
    updateCodes,
    1000
);

</script>

</body>
</html>
