<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2FA 验证器</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#0e1621;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px 15px 40px;
}

.header{
    text-align:center;
    padding:20px 0;
}

.logo{
    width:64px;
    height:64px;
    margin:auto;
    border-radius:18px;
    background:#2481cc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
}

h1{
    font-size:24px;
    margin:14px 0 5px;
}

.subtitle{
    color:#8c9aa8;
    font-size:14px;
}

.add-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    background:#2481cc;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin:10px 0 18px;
}

.add-btn:active{
    transform:scale(.98);
    opacity:.85;
}

.account{
    background:#17212b;
    border-radius:14px;
    padding:17px;
    margin-bottom:12px;
}

.account-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.account-name{
    font-size:16px;
    font-weight:600;
}

.delete{
    border:0;
    background:transparent;
    color:#ff5b5b;
    font-size:13px;
    cursor:pointer;
}

.code{
    font-size:36px;
    letter-spacing:6px;
    font-weight:700;
    text-align:center;
    margin:18px 0 8px;
}

.time{
    text-align:center;
    color:#8c9aa8;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#8c9aa8;
    padding:35px 10px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    align-items:flex-end;
    justify-content:center;
    z-index:999;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    background:#17212b;
    border-radius:18px 18px 0 0;
    padding:22px 18px 30px;
}

.modal-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:20px;
}

label{
    display:block;
    color:#aeb9c4;
    font-size:13px;
    margin:12px 0 6px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #2d3b48;
    border-radius:10px;
    background:#0e1621;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#2481cc;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.cancel,
.save{
    flex:1;
    border:0;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
}

.cancel{
    background:#263442;
    color:#fff;
}

.save{
    background:#2481cc;
    color:#fff;
    font-weight:600;
}

.tip{
    margin-top:12px;
    color:#7f8c98;
    font-size:12px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🔐</div>
        <h1>2FA 验证器</h1>
        <div class="subtitle">安全生成一次性验证码</div>
    </div>

    <button class="add-btn" id="addBtn">
        ＋ 添加账号
    </button>

    <div id="accounts"></div>

</div>


<!-- 添加账号弹窗 -->
<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-title">
            添加验证器账号
        </div>

        <label>账号名称</label>
        <input
            id="nameInput"
            type="text"
            placeholder="例如：Google"
            autocomplete="off"
        >

        <label>Secret Key</label>
        <input
            id="secretInput"
            type="text"
            placeholder="输入 TOTP Secret Key"
            autocomplete="off"
            autocapitalize="characters"
        >

        <div class="actions">
            <button class="cancel" id="cancelBtn">
                取消
            </button>

            <button class="save" id="saveBtn">
                保存
            </button>
        </div>

        <div class="tip">
            Secret Key 只保存在当前设备的浏览器本地，不上传到服务器。
        </div>

    </div>

</div>


<script>

const STORAGE_KEY = "tg_2fa_accounts_v2";

let accounts = [];


// =========================
// 读取本地账号
// =========================

function loadAccounts(){

    try{

        const data = localStorage.getItem(STORAGE_KEY);

        if(data){

            accounts = JSON.parse(data);

            if(!Array.isArray(accounts)){
                accounts = [];
            }

        }

    }catch(error){

        console.error(error);

        accounts = [];

    }

    renderAccounts();
}


// =========================
// 保存本地账号
// =========================

function saveAccounts(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );

}


// =========================
// Base32 解码
// =========================

function base32ToBytes(input){

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    let clean = input
        .toUpperCase()
        .replace(/[\s=-]/g,"");

    let bits = "";
    let bytes = [];

    for(let i=0;i<clean.length;i++){

        const value = alphabet.indexOf(clean[i]);

        if(value === -1){
            continue;
        }

        bits += value
            .toString(2)
            .padStart(5,"0");

    }

    for(let i=0;i+8<=bits.length;i+=8){

        bytes.push(
            parseInt(bits.slice(i,i+8),2)
        );

    }

    return new Uint8Array(bytes);

}


// =========================
// 生成 TOTP
// =========================

async function generateTOTP(secret){

    try{

        const keyBytes = base32ToBytes(secret);

        if(keyBytes.length === 0){
            return "------";
        }

        const epoch = Math.floor(Date.now()/1000);

        const counter = Math.floor(epoch/30);

        const buffer = new ArrayBuffer(8);

        const view = new DataView(buffer);

        view.setUint32(
            0,
            Math.floor(counter / 0x100000000)
        );

        view.setUint32(
            4,
            counter >>> 0
        );

        const cryptoKey =
            await crypto.subtle.importKey(
                "raw",
                keyBytes,
                {
                    name:"HMAC",
                    hash:"SHA-1"
                },
                false,
                ["sign"]
            );

        const signature =
            new Uint8Array(
                await crypto.subtle.sign(
                    "HMAC",
                    cryptoKey,
                    buffer
                )
            );

        const offset =
            signature[signature.length-1] & 15;

        const binary =
            ((signature[offset] & 127) << 24) |
            ((signature[offset+1] & 255) << 16) |
            ((signature[offset+2] & 255) << 8) |
            (signature[offset+3] & 255);

        const code =
            String(binary % 1000000)
            .padStart(6,"0");

        return code;

    }catch(error){

        console.error(error);

        return "------";

    }

}


// =========================
// 显示账号
// =========================

function renderAccounts(){

    const container =
        document.getElementById("accounts");

    container.innerHTML = "";

    if(accounts.length === 0){

        container.innerHTML = `
            <div class="empty">
                暂无验证器账号<br>
                点击上方「添加账号」开始使用
            </div>
        `;

        return;
    }

    accounts.forEach((account,index)=>{

        const div =
            document.createElement("div");

        div.className = "account";

        div.innerHTML = `

            <div class="account-top">

                <div class="account-name">
                    ${escapeHtml(account.name)}
                </div>

                <button
                    class="delete"
                    data-index="${index}"
                >
                    删除
                </button>

            </div>

            <div
                class="code"
                id="code-${index}"
            >
                ------
            </div>

            <div
                class="time"
                id="time-${index}"
            >
                正在生成验证码
            </div>

        `;

        container.appendChild(div);

    });


    document
        .querySelectorAll(".delete")
        .forEach(button=>{

            button.addEventListener(
                "click",
                function(){

                    const index =
                        Number(this.dataset.index);

                    if(confirm("确定删除这个账号吗？")){

                        accounts.splice(index,1);

                        saveAccounts();

                        renderAccounts();

                        updateCodes();

                    }

                }
            );

        });

}


// =========================
// HTML 转义
// =========================

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// =========================
// 更新验证码
// =========================

async function updateCodes(){

    const remaining =
        30 - (Math.floor(Date.now()/1000) % 30);

    for(let i=0;i<accounts.length;i++){

        const code =
            await generateTOTP(accounts[i].secret);

        const codeElement =
            document.getElementById(`code-${i}`);

        const timeElement =
            document.getElementById(`time-${i}`);

        if(codeElement){
            codeElement.textContent = code;
        }

        if(timeElement){

            timeElement.textContent =
                `验证码将在 ${remaining} 秒后更新`;

        }

    }

}


// =========================
// 打开弹窗
// =========================

function openModal(){

    document
        .getElementById("modal")
        .classList.add("show");

    document
        .getElementById("nameInput")
        .value = "";

    document
        .getElementById("secretInput")
        .value = "";

    setTimeout(()=>{

        document
            .getElementById("nameInput")
            .focus();

    },100);

}


// =========================
// 关闭弹窗
// =========================

function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("show");

}


// =========================
// 添加按钮
// =========================

document
    .getElementById("addBtn")
    .addEventListener(
        "click",
        function(){

            openModal();

        }
    );


// =========================
// 取消按钮
// =========================

document
    .getElementById("cancelBtn")
    .addEventListener(
        "click",
        function(){

            closeModal();

        }
    );


// =========================
// 保存按钮
// =========================

document
    .getElementById("saveBtn")
    .addEventListener(
        "click",
        async function(){

            const name =
                document
                .getElementById("nameInput")
                .value
                .trim();

            const secret =
                document
                .getElementById("secretInput")
                .value
                .trim()
                .replace(/\s/g,"")
                .toUpperCase();

            if(!name){

                alert("请输入账号名称");

                return;

            }

            if(!secret){

                alert("请输入 Secret Key");

                return;

            }

            const testCode =
                await generateTOTP(secret);

            if(testCode === "------"){

                alert("Secret Key 无效，请检查后重新输入");

                return;

            }

            accounts.push({

                id:Date.now().toString(),

                name:name,

                secret:secret

            });

            saveAccounts();

            closeModal();

            renderAccounts();

            updateCodes();

        }
    );


// =========================
// 点击背景关闭
// =========================

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeModal();

            }

        }
    );


// =========================
// 启动
// =========================

loadAccounts();

updateCodes();


// =========================
// 每秒刷新
// =========================

setInterval(

    function(){

        updateCodes();

    },

    1000

);

</script>

</body>
</html>
