/* =========================
   Base32
========================= */

function base32ToBytes(secret){

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    const clean =
        secret
        .toUpperCase()
        .replace(/[\s=-]/g,"");

    let bits = "";

    const bytes = [];

    for(let i=0;i<clean.length;i++){

        const value =
            alphabet.indexOf(clean[i]);

        if(value < 0){
            continue;
        }

        bits +=
            value
            .toString(2)
            .padStart(5,"0");

    }

    for(
        let i=0;
        i+8<=bits.length;
        i+=8
    ){

        bytes.push(
            parseInt(
                bits.slice(i,i+8),
                2
            )
        );

    }

    return new Uint8Array(bytes);

}


/* =========================
   TOTP
========================= */

async function generateTOTP(secret){

    try{

        const key =
            base32ToBytes(secret);

        if(!key.length){

            return null;

        }

        const counter =
            Math.floor(
                Date.now()/1000/30
            );

        const buffer =
            new ArrayBuffer(8);

        const view =
            new DataView(buffer);

        view.setUint32(
            0,
            Math.floor(
                counter / 4294967296
            )
        );

        view.setUint32(
            4,
            counter >>> 0
        );


        const cryptoKey =
            await crypto.subtle.importKey(
                "raw",
                key,
                {
                    name:"HMAC",
                    hash:"SHA-1"
                },
                false,
                ["sign"]
            );


        const signature =
            new Uint8Array(
                await crypto.subtle.sign(
                    "HMAC",
                    cryptoKey,
                    buffer
                )
            );


        const offset =
            signature[
                signature.length - 1
            ] & 15;


        const binary =
            (
                ((signature[offset] & 127) << 24) |
                ((signature[offset+1] & 255) << 16) |
                ((signature[offset+2] & 255) << 8) |
                (signature[offset+3] & 255)
            ) >>> 0;


        return String(
            binary % 1000000
        ).padStart(6,"0");


    }catch(e){

        console.error(e);

        return null;

    }

}
