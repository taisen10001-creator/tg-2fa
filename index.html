<script>

  /* ============================================================
     Telegram Mini App
  ============================================================ */

  const tg =
    window.Telegram?.WebApp || null;


  if (tg) {

    try {
      tg.ready();
      tg.expand();
    } catch (e) {
      console.log(e);
    }

  }


  /* ============================================================
     本地数据
  ============================================================ */

  const STORAGE_KEY =
    "tg_authenticator_accounts";

  let accounts = [];


  function loadAccounts() {

    try {

      const data =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (data) {

        const parsed =
          JSON.parse(data);

        if (Array.isArray(parsed)) {
          accounts = parsed;
        }

      }

    } catch (error) {

      console.error(
        "读取账号失败:",
        error
      );

      accounts = [];
    }

  }


  function saveAccounts() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
      );

    } catch (error) {

      console.error(
        "保存账号失败:",
        error
      );

    }

  }


  /* ============================================================
     Base32
  ============================================================ */

  function base32ToBytes(base32) {

    const clean =
      base32
        .toUpperCase()
        .replace(/[\s=-]/g, "");

    const alphabet =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    let bits = "";
    let output = [];

    for (
      let i = 0;
      i < clean.length;
      i++
    ) {

      const value =
        alphabet.indexOf(
          clean[i]
        );

      if (value === -1) {
        continue;
      }

      bits +=
        value
          .toString(2)
          .padStart(5, "0");

    }


    for (
      let i = 0;
      i + 8 <= bits.length;
      i += 8
    ) {

      output.push(
        parseInt(
          bits.slice(i, i + 8),
          2
        )
      );

    }


    return new Uint8Array(output);
  }


  /* ============================================================
     TOTP
  ============================================================ */

  async function generateTOTP(secret) {

    const keyBytes =
      base32ToBytes(secret);

    if (!keyBytes.length) {
      throw new Error("秘钥无效");
    }


    const counter =
      Math.floor(
        Date.now() / 1000 / 30
      );


    const counterBytes =
      new ArrayBuffer(8);

    const counterView =
      new DataView(
        counterBytes
      );


    counterView.setUint32(
      0,
      Math.floor(
        counter / 0x100000000
      )
    );


    counterView.setUint32(
      4,
      counter >>> 0
    );


    const cryptoKey =
      await crypto.subtle.importKey(
        "raw",
        keyBytes,
        {
          name: "HMAC",
          hash: "SHA-1"
        },
        false,
        ["sign"]
      );


    const signature =
      await crypto.subtle.sign(
        "HMAC",
        cryptoKey,
        counterBytes
      );


    const bytes =
      new Uint8Array(
        signature
      );


    const offset =
      bytes[
        bytes.length - 1
      ] & 0x0f;


    const binary =
      (
        ((bytes[offset] & 0x7f) << 24) |
        ((bytes[offset + 1] & 0xff) << 16) |
        ((bytes[offset + 2] & 0xff) << 8) |
        (bytes[offset + 3] & 0xff)
      );


    const code =
      binary % 1000000;


    return String(code)
      .padStart(6, "0");
  }


  /* ============================================================
     验证码格式
  ============================================================ */

  function formatCode(code) {

    if (!code) {
      return "------";
    }

    return (
      code.slice(0, 3) +
      " " +
      code.slice(3)
    );

  }

    clearTimeout(

    toastTimer =
      setTimeout(() => {

        toast.classList.remove(
          "show"
        );

      }, 1800);

  }

    );

      }

    }
  );


  /* ============================================================
     渲染账号
  ============================================================ */

  function renderAccounts() {

    const container =
      document.getElementById(
        "accounts"
      );


    const emptyState =
      document.getElementById(
        "emptyState"
      );


    container.innerHTML = "";


    if (accounts.length === 0) {

      emptyState.style.display =
        "block";

      return;

    }


    emptyState.style.display =
      "none";


    accounts.forEach(
      (account, index) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "account-card";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "account-name";

        name.textContent =
          account.name ||
          "未命名账号";


        const label =
          document.createElement(
            "div"
          );

        label.className =
          "code-label";

        label.textContent =
          "TOTP 验证码";


        const code =
          document.createElement(
            "div"
          );

        code.className =
          "code-value";

        code.id =
          "code-" + index;

        code.textContent =
          "------";


        const bottom =
          document.createElement(
            "div"
          );

        bottom.className =
          "card-bottom";


        const copyButton =
          document.createElement(
            "button"
          );

        copyButton.className =
          "copy-button";

        copyButton.type =
          "button";

        copyButton.textContent =
          "复制";


        copyButton.addEventListener(
          "click",
          async () => {

            const currentCode =
              document
                .getElementById(
                  "code-" + index
                )
                ?.textContent
                .replace(
                  /\s/g,
                  ""
                );


            if (
              !currentCode ||
              currentCode ===
                "------"
            ) {
              return;
            }


            try {

              await navigator
                .clipboard
                .writeText(
                  currentCode
                );

              showToast(
                "验证码已复制"
              );

            } catch (error) {

              const textarea =
                document.createElement(
                  "textarea"
                );

              textarea.value =
                currentCode;

              document.body.appendChild(
                textarea
              );

              textarea.select();

              document.execCommand(
                "copy"
              );

              textarea.remove();

              showToast(
                "验证码已复制"
              );

            }

          }
        );


        const seconds =
          document.createElement(
            "div"
          );

        seconds.className =
          "seconds";

        seconds.id =
          "seconds-" + index;

        seconds.textContent =
          "30秒";


        bottom.appendChild(
          copyButton
        );

        bottom.appendChild(
          seconds
        );


        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.className =
          "delete-button";

        deleteButton.type =
          "button";

        deleteButton.textContent =
          "删除账号";


        deleteButton.addEventListener(
          "click",
          () => {

            const confirmed =
              confirm(
                "确定要删除这个账号吗？"
              );


            if (!confirmed) {
              return;
            }


            accounts.splice(
              index,
              1
            );


            saveAccounts();

            renderAccounts();

            showToast(
              "账号已删除"
            );

          }
        );


        card.appendChild(
          name
        );

        card.appendChild(
          label
        );

        card.appendChild(
          code
        );

        card.appendChild(
          bottom
        );

        card.appendChild(
          deleteButton
        );


        container.appendChild(
          card
        );

      }
    );


    updateCodes();

  }


  /* ============================================================
     更新验证码
  ============================================================ */

  async function updateCodes() {

    const seconds =
      30 -
      (
        Math.floor(
          Date.now() / 1000
        ) % 30
      );


    accounts.forEach(
      async (account, index) => {

        const codeElement =
          document.getElementById(
            "code-" + index
          );


        const secondsElement =
          document.getElementById(
            "seconds-" + index
          );


        if (secondsElement) {

          secondsElement.textContent =
            seconds + "秒";

        }


        if (!codeElement) {
          return;
        }


        try {

          const code =
            await generateTOTP(
              account.secret
            );


          codeElement.textContent =
            formatCode(code);

        } catch (error) {

          console.error(
            "生成验证码失败:",
            error
          );

          codeElement.textContent =
            "------";

        }

      }
    );

  }


  /* ============================================================
     确认添加
  ============================================================ */

  async function addAccount() {

    const name =
      accountName.value.trim();


    const secret =
      secretKey.value
        .trim()
        .replace(/\s/g, "")
        .toUpperCase();


    if (!name) {

      showToast(
        "请输入账号名称"
      );

      accountName.focus();

      return;
    }


    if (!secret) {

      showToast(
        "请输入秘钥"
      );

      secretKey.focus();

      return;
    }


    try {

      await generateTOTP(
        secret
      );

    } catch (error) {

      showToast(
        "秘钥格式不正确"
      );

      secretKey.focus();

      return;
    }


    accounts.push({
      name: name,
      secret: secret
    });


    saveAccounts();

    accountName.value = "";
    secretKey.value = "";


    closeModal();

    renderAccounts();

    showToast(
      "账号添加成功"
    );

  }


  document
    .getElementById(
      "confirmButton"
    )
    .addEventListener(
      "click",
      addAccount
    );


  /* Secret Key 回车 */

  secretKey.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        addAccount();

      }

    }
  );


  /* ============================================================
     扫码
  ============================================================ */

  document
    .getElementById(
      "qrButton"
    )
    .addEventListener(
      "click",
      openScanner
    );


  function openScanner() {

    /*
      Telegram Mini App 原生扫码
    */

    if (
      !tg ||
      typeof tg.showScanQrPopup !==
        "function"
    ) {

      showToast(
        "请在 Telegram 机器人中打开此页面后扫码"
      );

      return;

    }


    try {

      tg.showScanQrPopup(
        {
          text:
            "扫描验证器二维码"
        },

        (result) => {

          if (!result) {
            return false;
          }


          handleQRCode(
            result
          );


          /*
            返回 true：
            告诉 Telegram 扫描成功，
            关闭扫码界面
          */

          return true;

        }
      );

    } catch (error) {

      console.error(
        "扫码失败:",
        error
      );

      showToast(
        "无法打开扫码"
      );

    }

  }


  /* ============================================================
     二维码解析
  ============================================================ */

  function handleQRCode(text) {

    try {

      if (
        !text ||
        !text
          .toLowerCase()
          .startsWith(
            "otpauth://"
          )
      ) {

        showToast(
          "不是有效的验证器二维码"
        );

        return;

      }


      const url =
        new URL(text);


      const secret =
        url.searchParams.get(
          "secret"
        );


      if (!secret) {

        showToast(
          "二维码中没有找到秘钥"
        );

        return;

      }


      let name = "";


      const path =
        decodeURIComponent(
          url.pathname
            .replace(
              /^\/+/,
              ""
            )
        );


      if (
        path.includes(":")
      ) {

        name =
          path
            .split(":")
            .slice(1)
            .join(":");

      } else {

        name = path;

      }


      if (!name) {

        name =
          "扫描添加的账号";

      }


      accountName.value =
        name;


      secretKey.value =
        secret
          .replace(/\s/g, "")
          .toUpperCase();


      showToast(
        "二维码识别成功"
      );

    } catch (error) {

      console.error(
        "二维码解析失败:",
        error
      );

      showToast(
        "二维码解析失败"
      );

    }

  }


  /* ============================================================
     初始化
  ============================================================ */

  loadAccounts();

  renderAccounts();


  /* ============================================================
     每秒更新
  ============================================================ */

  setInterval(
    updateCodes,
    1000
  );

</script>
