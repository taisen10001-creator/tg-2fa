
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>验证器</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #f7f8fa;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                Arial,
                sans-serif;
            color: #202124;
        }

        body {
            padding-bottom: 30px;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .content {
            padding: 22px 16px 30px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 32px 20px 30px;
        }

        .empty-icon {
            font-size: 52px;
            line-height: 1;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .empty-text {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
        }

        /* 账号列表 */
        .accounts {
            margin-top: 0;
        }

        .account-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 17px 16px 15px;
            margin-bottom: 12px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.05);
        }

        .account-name {
            font-size: 15px;
            font-weight: 500;
            color: #555;
            margin-bottom: 9px;
            word-break: break-all;
        }

        .code-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .code-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        /* 验证码放大 */
        .code {
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #202124;
            line-height: 1.2;
            cursor: pointer;
            user-select: none;
        }

        /* 复制按钮放大 */
        .copy-button {
            border: 0;
            background: #f1f3f4;
            color: #1a73e8;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
            min-width: 58px;
        }

        .copy-button:active {
            transform: scale(0.96);
        }

        /* 底部信息 */
        .account-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 11px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }

        /* 删除账号放左边 */
        .delete-button {
            order: 1;
            border: 0;
            background: transparent;
            color: #d93025;
            font-size: 14px;
            padding: 4px 0;
            cursor: pointer;
        }

        /* 倒计时放右边并放大 */
        .seconds {
            order: 2;
            color: #777;
            font-size: 16px;
            font-weight: 500;
        }

        /* 添加账号区域 */
        .add-section {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px 16px 18px;
            margin-top: 18px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.05);
        }

        .add-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        /* 添加账号旁边的 + */
        .add-inline-button {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #1a73e8;
            font-size: 29px;
            line-height: 38px;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-inline-button:active {
            background: #f1f3f4;
            transform: scale(0.95);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .form-input-wrap {
            position: relative;
            width: 100%;
            margin-bottom: 0;
        }

        .form-input {
            width: 100%;
            height: 48px;
            border: 1px solid #dcdfe3;
            border-radius: 9px;
            background: #ffffff;
            outline: none;
            padding: 0 13px;
            font-size: 15px;
            color: #202124;
            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: #1a73e8;
            box-shadow:
                0 0 0 2px rgba(26, 115, 232, 0.1);
        }

        .secret-input {
            padding-right: 110px;
        }

        /* 密钥输入框里的扫码添加 */
        .scan-inside-button {
            position: absolute;
            right: 5px;
            top: 5px;
            height: 38px;
            padding: 0 10px;
            border: 0;
            border-radius: 7px;
            background: #f1f3f4;
            color: #1a73e8;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .scan-inside-button:active {
            transform: scale(0.97);
        }

        .confirm-button {
            width: 100%;
            height: 48px;
            margin-top: 2px;
            border: 0;
            border-radius: 9px;
            background: #1a73e8;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .confirm-button:active {
            transform: scale(0.99);
        }

        /* 宣传区域 */
        .promo {
            margin-top: 22px;
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
        }

        .promo-image-link {
            display: block;
            width: 100%;
            line-height: 0;
            cursor: pointer;
        }

        .promo-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px 12px 0 0;
            object-fit: cover;
        }

        .promo-button {
            display: flex;
            width: 100%;
            height: 46px;
            align-items: center;
            justify-content: center;
            background: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            border-radius: 0 0 12px 12px;
        }

        .promo-button:active {
            opacity: 0.9;
        }

        /* Toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform:
                translateX(-50%)
                translateY(20px);
            background: rgba(32, 33, 36, 0.92);
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform:
                translateX(-50%)
                translateY(0);
        }

        @media (max-width: 360px) {

            .code {
                font-size: 30px;
            }

            .copy-button {
                padding: 9px 12px;
                font-size: 14px;
                min-width: 54px;
            }

            .seconds {
                font-size: 15px;
            }

            .scan-inside-button {
                padding: 0 8px;
                font-size: 12px;
            }

            .secret-input {
                padding-right: 102px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <main class="content">

        <!-- 空状态 -->
        <div

        >
            <div class="empty-icon">
                🔐
            </div>

            <div class="empty-title">
                暂无账号
            </div>

            <div class="empty-text">
                在下面输入账号信息，或直接扫描验证器二维码
            </div>
        </div>


        <!-- 已添加账号 -->
        <section

        ></section>


        <!-- 添加账号 -->
        <section

            <div class="add-title-row">

                <div class="section-title">

                <button

                    <input
                        class="form-input secret-input"

                    <!-- 扫码添加 -->

                        class="scan-inside-button"

        </section>


        <!-- 宣传图 -->
        <div class="promo">

            <!-- 点击图片跳转 @kytttt -->
            <a
                class="promo-image-link"
                href="https://t.me/kytttt"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    class="promo-image"
                    src="./998965656565656565.jpg"
                    alt="宣传图"
                >

            </a>


            <!-- 立即咨询跳转 @oooky -->
            <a
                class="promo-button"

            >
                立即咨询
            </a>

        </div>

    </main>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

    /* Telegram Mini App */

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

    if (tg) {
        tg.ready();
        tg.expand();
    }


    /* 基础变量 */

    const STORAGE_KEY =
        "tg_authenticator_accounts";

    const emptyState =
        document.getElementById(
            "emptyState"
        );

    const addSection =
        document.getElementById(
            "addSection"
        );

    const accountsContainer =
        document.getElementById(
            "accounts"
        );

    const nameInput =
        document.getElementById(
            "nameInput"
        );

    const secretInput =
        document.getElementById(
            "secretInput"
        );

    const confirmButton =
        document.getElementById(
            "confirmButton"
        );

    const scanButton =
        document.getElementById(
            "scanButton"
        );

    const addInlineButton =
        document.getElementById(
            "addInlineButton"
        );

    const toast =
        document.getElementById(
            "toast"
        );

    let toastTimer = null;


    /* Toast */

    function showToast(message) {

        clearTimeout(toastTimer);

        toast.textContent =
            message;

        toast.classList.add(
            "show"
        );

        toastTimer =
            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 1800);
    }


    /* LocalStorage */

    function loadAccounts() {

        try {

            const data =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (!data) {
                return [];
            }

            const accounts =
                JSON.parse(data);

            return Array.isArray(accounts)
                ? accounts
                : [];

        } catch (error) {

            console.error(error);

            return [];
        }
    }


    function saveAccounts(accounts) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(accounts)
        );
    }


    /* Base32 */

    function base32ToBytes(base32) {

        const clean =
            String(base32)
                .toUpperCase()
                .replace(
                    /[\s=-]/g,
                    ""
                );

        const alphabet =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

        let bits = "";

        let output = [];

        for (const char of clean) {

            const value =
                alphabet.indexOf(
                    char
                );

            if (value === -1) {
                continue;
            }

            bits +=
                value
                    .toString(2)
                    .padStart(5, "0");
        }

        for (
            let i = 0;
            i + 8 <= bits.length;
            i += 8
        ) {

            output.push(
                parseInt(
                    bits.substring(
                        i,
                        i + 8
                    ),
                    2
                )
            );
        }

        return new Uint8Array(
            output
        );
    }


    /* TOTP */

    async function generateTOTP(
        secret
    ) {

        const keyBytes =
            base32ToBytes(
                secret
            );

        if (!keyBytes.length) {

            throw new Error(
                "密钥无效"
            );
        }

        const counter =
            Math.floor(
                Date.now() /
                1000 /
                30
            );

        const counterBytes =
            new ArrayBuffer(8);

        const counterView =
            new DataView(
                counterBytes
            );

        const high =
            Math.floor(
                counter /
                0x100000000
            );

        const low =
            counter >>> 0;

        counterView.setUint32(
            0,
            high
        );

        counterView.setUint32(
            4,
            low
        );

        const cryptoKey =
            await crypto.subtle.importKey(
                "raw",
                keyBytes,
                {
                    name: "HMAC",
                    hash: "SHA-1"
                },
                false,
                ["sign"]
            );

        const signature =
            await crypto.subtle.sign(
                "HMAC",
                cryptoKey,
                counterBytes
            );

        const bytes =
            new Uint8Array(
                signature
            );

        const offset =
            bytes[
                bytes.length - 1
            ] & 15;

        const binary =
            (
                (bytes[offset] & 127)
                << 24
            ) |
            (
                (bytes[offset + 1] & 255)
                << 16
            ) |
            (
                (bytes[offset + 2] & 255)
                << 8
            ) |
            (
                bytes[offset + 3] & 255
            );

        return String(
            binary % 1000000
        ).padStart(
            6,
            "0"
        );
    }


    /* QR 解析 */

    function parseOtpAuth(uri) {

        try {

            if (
                typeof uri !== "string" ||
                !uri
                    .toLowerCase()
                    .startsWith(
                        "otpauth://"
                    )
            ) {
                return null;
            }

            const url =
                new URL(uri);

            const type =
                url.hostname.toLowerCase();

            if (type !== "totp") {
                return null;
            }

            const secret =
                url.searchParams.get(
                    "secret"
                ) || "";

            if (!secret) {
                return null;
            }

            const issuer =
                url.searchParams.get(
                    "issuer"
                ) || "";

            let account =
                decodeURIComponent(
                    url.pathname.replace(
                        /^\/+/,
                        ""
                    )
                );

            if (
                account.includes(":")
            ) {

                account =
                    account
                        .split(":")
                        .slice(1)
                        .join(":");
            }

            account =
                account ||
                "新账号";

            return {

                name: issuer
                    ? issuer +
                      " - " +
                      account
                    : account,

                secret:
                    secret
            };

        } catch (error) {

            console.error(error);

            return null;
        }
    }


    /* 扫码添加 */

    function startScan() {

        if (
            !tg ||
            typeof tg.showScanQrPopup !==
                "function"
        ) {

            showToast(
                "请在 Telegram 中使用扫码功能"
            );

            return;
        }

        tg.showScanQrPopup(
            {
                text:
                    "扫描验证器二维码"
            },

            function (qrText) {

                if (!qrText) {
                    return true;
                }

                const result =
                    parseOtpAuth(
                        qrText
                    );

                if (!result) {

                    showToast(
                        "二维码格式不正确"
                    );

                    return true;
                }

                nameInput.value =
                    result.name;

                secretInput.value =
                    result.secret;

                showToast(
                    "二维码读取成功"
                );

                setTimeout(
                    () => {

                        secretInput.focus();

                    },
                    100
                );

                return true;
            }
        );
    }


    /* 添加账号 */

    async function addAccount() {

        const name =
            nameInput.value.trim();

        const secret =
            secretInput.value
                .trim()
                .replace(
                    /\s+/g,
                    ""
                )
                .toUpperCase();

        if (!name) {

            showToast(
                "请输入账号名称"
            );

            nameInput.focus();

            return;
        }

        if (!secret) {

            showToast(
                "请输入密钥"
            );

            secretInput.focus();

            return;
        }

        try {

            await generateTOTP(
                secret
            );

        } catch (error) {

            showToast(
                "密钥无效，请检查后重试"
            );

            secretInput.focus();

            return;
        }

        const accounts =
            loadAccounts();

        accounts.push({

            id:
                Date.now()
                    .toString() +
                Math.random()
                    .toString(36)
                    .slice(2),

            name:
                name,

            secret:
                secret
        });

        saveAccounts(
            accounts
        );

        nameInput.value =
            "";

        secretInput.value =
            "";

        renderAccounts();

        showToast(
            "账号添加成功"
        );

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /* 删除账号 */

    function deleteAccount(id) {

        const confirmed =
            window.confirm(
                "确定要删除这个账号吗？"
            );

        if (!confirmed) {
            return;
        }

        const accounts =
            loadAccounts()
                .filter(
                    account =>
                        account.id !== id
                );

        saveAccounts(
            accounts
        );

        renderAccounts();

        showToast(
            "账号已删除"
        );
    }


    /* 复制验证码 */

    async function copyCode(code) {

        const cleanCode =
            String(code)
                .replace(
                    /\s/g,
                    ""
                );

        try {

            if (
                navigator.clipboard &&
                navigator.clipboard.writeText
            ) {

                await navigator.clipboard.writeText(
                    cleanCode
                );

            } else {

                const textarea =
                    document.createElement(
                        "textarea"
                    );

                textarea.value =
                    cleanCode;

                document.body.appendChild(
                    textarea
                );

                textarea.select();

                document.execCommand(
                    "copy"
                );

                textarea.remove();
            }

            showToast(
                "验证码已复制"
            );

        } catch (error) {

            console.error(error);

            showToast(
                "复制失败"
            );
        }
    }


    /* 创建账号卡片 */

    function createAccountCard(
        account
    ) {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "account-card";


        const accountName =
            document.createElement(
                "div"
            );

        accountName.className =
            "account-name";

        accountName.textContent =
            account.name;


        const codeLabel =
            document.createElement(
                "div"
            );

        codeLabel.className =
            "code-label";

        codeLabel.textContent =
            "TOTP 验证码";


        const codeRow =
            document.createElement(
                "div"
            );

        codeRow.className =
            "code-row";


        const code =
            document.createElement(
                "div"
            );

        code.className =
            "code";

        code.textContent =
            "------";

        code.title =
            "点击复制验证码";


        code.addEventListener(
            "click",
            () => {

                const raw =
                    code.dataset.rawCode;

                if (raw) {
                    copyCode(raw);
                }
            }
        );


        const copyButton =
            document.createElement(
                "button"
            );

        copyButton.className =
            "copy-button";

        copyButton.type =
            "button";

        copyButton.textContent =
            "复制";


        copyButton.addEventListener(
            "click",
            () => {

                const raw =
                    code.dataset.rawCode;

                if (raw) {
                    copyCode(raw);
                }
            }
        );


        codeRow.appendChild(
            code
        );

        codeRow.appendChild(
            copyButton
        );


        const bottom =
            document.createElement(
                "div"
            );

        bottom.className =
            "account-bottom";


        /* 删除账号 */
        const deleteButton =
            document.createElement(
                "button"
            );

        deleteButton.className =
            "delete-button";

        deleteButton.type =
            "button";

        deleteButton.textContent =
            "删除账号";


        deleteButton.addEventListener(
            "click",
            () => {

                deleteAccount(
                    account.id
                );
            }
        );


        /* 倒计时 */
        const seconds =
            document.createElement(
                "div"
            );

        seconds.className =
            "seconds";


        /*
         * 顺序：
         * 左边 = 删除账号
         * 右边 = 倒计时
         */
        bottom.appendChild(
            deleteButton
        );

        bottom.appendChild(
            seconds
        );


        card.appendChild(
            accountName
        );

        card.appendChild(
            codeLabel
        );

        card.appendChild(
            codeRow
        );

        card.appendChild(
            bottom
        );


        updateAccountCard(
            account,
            code,
            seconds
        );


        return card;
    }


    /* 更新验证码 */

    async function updateAccountCard(
        account,
        codeElement,
        secondsElement
    ) {

        try {

            const code =
                await generateTOTP(
                    account.secret
                );

            const formatted =
                code.substring(0, 3) +
                " " +
                code.substring(3);

            codeElement.textContent =
                formatted;

            codeElement.dataset.rawCode =
                code;

        } catch (error) {

            console.error(error);

            codeElement.textContent =
                "------";

            codeElement.dataset.rawCode =
                "";
        }

        updateSeconds(
            secondsElement
        );
    }


    /* 倒计时 */

    function updateSeconds(
        element
    ) {

        const now =
            Math.floor(
                Date.now() / 1000
            );

        const remaining =
            30 -
            (now % 30);

        element.textContent =
            remaining +
            " 秒后刷新";
    }


    /* 渲染账号 */

    function renderAccounts() {

        const accounts =
            loadAccounts();

        accountsContainer.innerHTML =
            "";

        if (
            accounts.length === 0
        ) {

            emptyState.style.display =
                "block";

        } else {

            emptyState.style.display =
                "none";

            accounts.forEach(
                account => {

                    const card =
                        createAccountCard(
                            account
                        );

                    accountsContainer.appendChild(
                        card
                    );
                }
            );
        }
    }


    /* 刷新验证码 */

    async function refreshCodes() {

        const cards =
            accountsContainer.querySelectorAll(
                ".account-card"
            );

        const accounts =
            loadAccounts();

        for (
            let i = 0;
            i < cards.length;
            i++
        ) {

            const card =
                cards[i];

            const account =
                accounts[i];

            if (!account) {
                continue;
            }

            const codeElement =
                card.querySelector(
                    ".code"
                );

            const secondsElement =
                card.querySelector(
                    ".seconds"
                );

            if (
                codeElement &&
                secondsElement
            ) {

                await updateAccountCard(
                    account,
                    codeElement,
                    secondsElement
                );
            }
        }
    }


    /* 添加账号 + */

    addInlineButton.addEventListener(
        "click",
        () => {

            addSection.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            setTimeout(
                () => {

                    nameInput.focus();

                },
                350
            );
        }
    );


    /* 按钮 */

    confirmButton.addEventListener(
        "click",
        addAccount
    );

    scanButton.addEventListener(
        "click",
        startScan
    );


    /* 回车 */

    nameInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                secretInput.focus();
            }
        }
    );


    secretInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                addAccount();
            }
        }
    );


    /* 每秒刷新 */

    setInterval(
        () => {

            refreshCodes();

        },
        1000
    );


    /* 初始化 */

    renderAccounts();

    refreshCodes();

</script>

</body>
</html>
