<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>验证器</title>

<style>

/* ==============================
   基础
============================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background:#f7f8fa;
    color:#202124;
}

body{
    padding-bottom:30px;
}


/* ==============================
   顶部导航
============================== */

.header{

    height:72px;

    background:#ffffff;

    border-bottom:1px solid #e5e7eb;

    display:flex;

    align-items:center;

    justify-content:center;

    position:sticky;

    top:0;

    z-index:50;

    padding:0 16px;
}


/* 左侧占位 */

.header-left{

    position:absolute;

    left:16px;

    width:40px;

    height:40px;
}


/* ==============================
   顶部招商文字
============================== */

.profile-link{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:8px 12px;

    border-radius:8px;

    text-decoration:none;

    color:#202124;

    font-size:15px;

    font-weight:600;

    line-height:20px;

    white-space:nowrap;

    transition:
        background .15s,
        opacity .15s;
}

.profile-link:active{

    background:#f1f3f4;

    opacity:.65;
}


/* ==============================
   添加按钮
============================== */

.add-button{

    position:absolute;

    right:12px;

    top:14px;

    width:44px;

    height:44px;

    border:0;

    border-radius:50%;

    background:transparent;

    color:#333;

    font-size:30px;

    font-weight:300;

    line-height:42px;

    padding:0;

    cursor:pointer;
}

.add-button:active{

    background:#f0f1f2;
}


/* ==============================
   页面主体
============================== */

.container{

    width:100%;

    max-width:600px;

    margin:0 auto;

    padding:16px;
}


/* ==============================
   空状态
============================== */

.empty-state{

    text-align:center;

    padding:90px 20px 70px;

    color:#6b7280;
}

.empty-icon{

    width:64px;

    height:64px;

    margin:0 auto 20px;

    border-radius:50%;

    background:#eef1f4;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;
}

.empty-title{

    font-size:18px;

    font-weight:500;

    color:#303134;

    margin-bottom:8px;
}

.empty-description{

    font-size:14px;

    line-height:22px;

    color:#70757a;
}


/* ==============================
   账号卡片
============================== */

.account-card{

    background:#ffffff;

    border-radius:14px;

    border:1px solid #e3e6e9;

    margin-bottom:14px;

    padding:18px;

    box-shadow:
        0 1px 3px rgba(0,0,0,.04);
}


/* 账号标题 */

.account-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    min-height:26px;

    margin-bottom:10px;
}

.account-name{

    font-size:15px;

    font-weight:500;

    color:#3c4043;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    padding-right:10px;
}


/* 删除 */

.delete-button{

    border:0;

    background:transparent;

    color:#80868b;

    font-size:13px;

    padding:6px;

    cursor:pointer;

    border-radius:6px;
}

.delete-button:active{

    background:#fce8e6;

    color:#d93025;
}


/* ==============================
   验证码
============================== */

.code{

    font-size:40px;

    font-weight:600;

    letter-spacing:5px;

    line-height:52px;

    color:#202124;

    font-variant-numeric:
        tabular-nums;

    cursor:pointer;

    user-select:text;

    white-space:nowrap;
}


/* 点击提示 */

.code-tip{

    margin-top:2px;

    font-size:12px;

    color:#9aa0a6;
}


/* ==============================
   复制按钮
============================== */

.copy-button{

    width:100%;

    height:42px;

    margin-top:14px;

    border:0;

    border-radius:8px;

    background:#f1f3f4;

    color:#3c4043;

    font-size:14px;

    font-weight:500;

    cursor:pointer;

    transition:
        background .15s;
}

.copy-button:active{

    background:#e5e7e9;
}


/* ==============================
   倒计时
============================== */

.timer{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:15px;
}

.timer-number{

    width:25px;

    font-size:12px;

    color:#6f7377;

    text-align:right;

    font-variant-numeric:
        tabular-nums;
}

.progress{

    flex:1;

    height:4px;

    background:#e7e9eb;

    border-radius:10px;

    overflow:hidden;
}

.progress-bar{

    width:100%;

    height:100%;

    background:#4285f4;

    border-radius:10px;

    transition:
        width .2s linear;
}


/* ==============================
   弹窗遮罩
============================== */

.modal-mask{

    position:fixed;

    inset:0;

    z-index:100;

    background:
        rgba(0,0,0,.42);

    display:none;

    align-items:flex-end;

    justify-content:center;
}

.modal-mask.show{

    display:flex;
}


/* ==============================
   弹窗
============================== */

.modal{

    width:100%;

    max-width:600px;

    background:#ffffff;

    border-radius:
        20px
        20px
        0
        0;

    padding:
        24px
        18px
        30px;

    animation:
        modalUp .22s ease;
}

@keyframes modalUp{

    from{
        transform:
            translateY(100%);
    }

    to{
        transform:
            translateY(0);
    }
}


/* 弹窗标题 */

.modal-title{

    font-size:20px;

    font-weight:600;

    color:#202124;

    margin-bottom:22px;
}


/* 输入 */

.input-group{

    margin-bottom:16px;
}

.input-label{

    display:block;

    font-size:13px;

    color:#5f6368;

    margin-bottom:7px;
}

.input{

    width:100%;

    height:48px;

    border:
        1px solid
        #dadce0;

    border-radius:8px;

    outline:none;

    padding:
        0 13px;

    font-size:15px;

    color:#202124;

    background:#fff;

    transition:
        border .15s,
        box-shadow .15s;
}

.input:focus{

    border-color:#4285f4;

    box-shadow:
        0 0 0 2px
        rgba(66,133,244,.12);
}


/* ==============================
   弹窗按钮
============================== */

.modal-actions{

    display:flex;

    gap:10px;

    margin-top:22px;
}

.cancel-button,
.save-button{

    flex:1;

    height:46px;

    border-radius:8px;

    font-size:15px;

    cursor:pointer;
}

.cancel-button{

    border:
        1px solid
        #dadce0;

    background:#fff;

    color:#3c4043;
}

.save-button{

    border:0;

    background:#4285f4;

    color:#fff;

    font-weight:500;
}

.save-button:active{

    opacity:.85;
}


/* ==============================
   Toast
============================== */

.toast{

    position:fixed;

    left:50%;

    bottom:35px;

    transform:
        translate(-50%,20px);

    padding:
        9px 17px;

    background:
        rgba(32,33,36,.94);

    color:#fff;

    border-radius:20px;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:200;

    white-space:nowrap;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* ==============================
   手机优化
============================== */

@media(max-width:420px){

    .header{

        height:72px;
    }

    .profile-link{

        font-size:14px;

        padding:
            8px 6px;
    }

    .code{

        font-size:35px;

        letter-spacing:4px;
    }

    .account-card{

        padding:17px;
    }

}

</style>
</head>


<body>


<!-- ==================================
     顶部
================================== -->

<header class="header">


    <!-- 左侧占位 -->

    <div class="header-left"></div>


    <!--
        顶部招商入口

        点击跳转 Telegram
    -->

    <a
        class="profile-link"
        href="https://t.me/oooky"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="开云体育官方招商"
    >
        开云体育官方招商 @oooky
    </a>


    <!-- 添加账号 -->

    <button
        class="add-button"
        id="addButton"
        aria-label="添加账号"
    >
        ＋
    </button>

</header>



<!-- ==================================
     主体
================================== -->

<main class="container">


    <!-- 账号列表 -->

    <div id="accountList"></div>


    <!-- 空状态 -->

    <div
        class="empty-state"
        id="emptyState"
    >

        <div class="empty-icon">
            🔐
        </div>

        <div class="empty-title">
            暂无验证账号
        </div>

        <div class="empty-description">
            点击右上角「＋」添加验证账号
        </div>

    </div>


</main>



<!-- ==================================
     添加账号弹窗
================================== -->

<div
    class="modal-mask"
    id="modalMask"
>

    <div class="modal">


        <div class="modal-title">
            添加验证账号
        </div>


        <!-- 账号名称 -->

        <div class="input-group">

            <label class="input-label">
                账号名称
            </label>

            <input
                class="input"
                id="accountName"
                type="text"
                placeholder="例如：Google"
                autocomplete="off"
            >

        </div>


        <!-- Secret Key -->

        <div class="input-group">

            <label class="input-label">
                Secret Key
            </label>

            <input
                class="input"
                id="secretKey"
                type="text"
                placeholder="请输入验证器密钥"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
            >

        </div>


        <!-- 操作 -->

        <div class="modal-actions">

            <button
                class="cancel-button"
                id="cancelButton"
            >
                取消
            </button>

            <button
                class="save-button"
                id="saveButton"
            >
                添加账号
            </button>

        </div>


    </div>

</div>



<!-- Toast -->

<div
    class="toast"
    id="toast"
></div>



<script>

/* ==================================
   本地存储
================================== */

const STORAGE_KEY =
    "tg_authenticator_accounts";

let accounts = [];


try{

    accounts =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"
        );

    if(
        !Array.isArray(accounts)
    ){

        accounts = [];

    }

}catch(error){

    accounts = [];

}


/* ==================================
   Base32
================================== */

function base32ToBytes(base32){

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    const clean =
        String(base32)
            .toUpperCase()
            .replace(
                /[\s=-]/g,
                ""
            );

    let bits = "";

    const bytes = [];


    for(
        const char of clean
    ){

        const value =
            alphabet.indexOf(char);


        if(value === -1){

            continue;

        }


        bits +=
            value
                .toString(2)
                .padStart(
                    5,
                    "0"
                );

    }


    for(
        let i = 0;
        i + 8 <= bits.length;
        i += 8
    ){

        bytes.push(

            parseInt(
                bits.substring(
                    i,
                    i + 8
                ),
                2
            )

        );

    }


    return new Uint8Array(
        bytes
    );

}


/* ==================================
   HMAC SHA-1
================================== */

async function hmacSha1(
    keyBytes,
    messageBytes
){

    const key =
        await crypto.subtle.importKey(

            "raw",

            keyBytes,

            {
                name:"HMAC",
                hash:"SHA-1"
            },

            false,

            ["sign"]

        );


    const signature =
        await crypto.subtle.sign(

            "HMAC",

            key,

            messageBytes

        );


    return new Uint8Array(
        signature
    );

}


/* ==================================
   TOTP
================================== */

async function generateTOTP(
    secret
){

    try{

        const key =
            base32ToBytes(
                secret
            );


        if(
            !key.length
        ){

            return "------";

        }


        /*
           30秒一个周期
        */

        const counter =
            Math.floor(
                Date.now() / 1000 / 30
            );


        const buffer =
            new ArrayBuffer(8);


        const view =
            new DataView(
                buffer
            );


        view.setUint32(
            0,
            Math.floor(
                counter /
                0x100000000
            )
        );


        view.setUint32(
            4,
            counter >>> 0
        );


        const hash =
            await hmacSha1(

                key,

                new Uint8Array(
                    buffer
                )

            );


        const offset =
            hash[
                hash.length - 1
            ] & 0x0f;


        const binary =

            ((hash[offset] & 0x7f) << 24)

            |

            ((hash[offset + 1] & 0xff) << 16)

            |

            ((hash[offset + 2] & 0xff) << 8)

            |

            (hash[offset + 3] & 0xff);


        const otp =
            binary % 1000000;


        return String(
            otp
        ).padStart(
            6,
            "0"
        );


    }catch(error){

        console.error(
            error
        );

        return "------";

    }

}


/* ==================================
   保存
================================== */

function saveAccounts(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
            accounts
        )

    );

}


/* ==================================
   Toast
================================== */

let toastTimer;


function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(

            function(){

                toast.classList.remove(
                    "show"
                );

            },

            1600

        );

}


/* ==================================
   HTML安全
================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==================================
   渲染
================================== */

async function renderAccounts(){

    const list =
        document.getElementById(
            "accountList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    list.innerHTML =
        "";


    if(
        accounts.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    for(
        let i = 0;
        i < accounts.length;
        i++
    ){

        const account =
            accounts[i];


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "account-card";


        card.innerHTML = `

            <div class="account-header">

                <div class="account-name">
                    ${escapeHtml(
                        account.name
                    )}
                </div>

                <button
                    class="delete-button"
                    data-index="${i}"
                >
                    删除
                </button>

            </div>


            <div
                class="code"
                id="code-${i}"
                data-index="${i}"
            >
                ------
            </div>


            <div class="code-tip">
                点击验证码即可复制
            </div>


            <button
                class="copy-button"
                data-index="${i}"
            >
                复制验证码
            </button>


            <div class="timer">

                <div
                    class="timer-number"
                    id="timer-${i}"
                >
                    30
                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progress-${i}"
                    ></div>

                </div>

            </div>

        `;


        list.appendChild(
            card
        );

    }


    bindButtons();

    await updateCodes();

}


/* ==================================
   按钮
================================== */

function bindButtons(){


    /* 删除 */

    document
        .querySelectorAll(
            ".delete-button"
        )
        .forEach(

            function(button){

                button.addEventListener(

                    "click",

                    function(){

                        deleteAccount(
                            Number(
                                button.dataset.index
                            )
                        );

                    }

                );

            }

        );


    /* 复制 */

    document
        .querySelectorAll(
            ".copy-button"
        )
        .forEach(

            function(button){

                button.addEventListener(

                    "click",

                    function(){

                        copyCode(
                            Number(
                                button.dataset.index
                            )
                        );

                    }

                );

            }

        );


    /* 点击验证码 */

    document
        .querySelectorAll(
            ".code"
        )
        .forEach(

            function(code){

                code.addEventListener(

                    "click",

                    function(){

                        copyCode(
                            Number(
                                code.dataset.index
                            )
                        );

                    }

                );

            }

        );

}


/* ==================================
   更新验证码
================================== */

async function updateCodes(){

    const currentTime =
        Math.floor(
            Date.now() / 1000
        );


    const remaining =
        30 -
        (
            currentTime % 30
        );


    const percentage =
        (
            remaining / 30
        ) * 100;


    for(
        let i = 0;
        i < accounts.length;
        i++
    ){

        const code =
            await generateTOTP(
                accounts[i].secret
            );


        const codeElement =
            document.getElementById(
                `code-${i}`
            );


        const timerElement =
            document.getElementById(
                `timer-${i}`
            );


        const progressElement =
            document.getElementById(
                `progress-${i}`
            );


        if(
            codeElement
        ){

            if(
                code.length === 6
            ){

                codeElement.textContent =
                    code.substring(
                        0,
                        3
                    )
                    +
                    " "
                    +
                    code.substring(
                        3
                    );

            }else{

                codeElement.textContent =
                    code;

            }

        }


        if(
            timerElement
        ){

            timerElement.textContent =
                remaining;

        }


        if(
            progressElement
        ){

            progressElement.style.width =
                percentage + "%";

        }

    }

}


/* ==================================
   删除
================================== */

function deleteAccount(
    index
){

    if(
        !accounts[index]
    ){

        return;

    }


    const confirmed =
        confirm(
            "确定要删除这个验证账号吗？"
        );


    if(
        !confirmed
    ){

        return;

    }


    accounts.splice(
        index,
        1
    );


    saveAccounts();


    renderAccounts();


    showToast(
        "账号已删除"
    );

}


/* ==================================
   复制
================================== */

async function copyCode(
    index
){

    if(
        !accounts[index]
    ){

        return;

    }


    const code =
        await generateTOTP(
            accounts[index].secret
        );


    if(
        code === "------"
    ){

        showToast(
            "验证码生成失败"
        );

        return;

    }


    try{

        await navigator.clipboard.writeText(
            code
        );


        showToast(
            "验证码已复制"
        );


    }catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            code;


        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        showToast(
            "验证码已复制"
        );

    }

}


/* ==================================
   弹窗
================================== */

const modalMask =
    document.getElementById(
        "modalMask"
    );


const accountName =
    document.getElementById(
        "accountName"
    );


const secretKey =
    document.getElementById(
        "secretKey"
    );


/* 打开 */

function openModal(){

    modalMask.classList.add(
        "show"
    );


    setTimeout(

        function(){

            accountName.focus();

        },

        100

    );

}


/* 关闭 */

function closeModal(){

    modalMask.classList.remove(
        "show"
    );


    accountName.value =
        "";

    secretKey.value =
        "";

}


/* ==================================
   添加按钮
================================== */

document
    .getElementById(
        "addButton"
    )
    .addEventListener(

        "click",

        openModal

    );


/* ==================================
   取消
================================== */

document
    .getElementById(
        "cancelButton"
    )
    .addEventListener(

        "click",

        closeModal

    );


/* ==================================
   点击遮罩
================================== */

modalMask.addEventListener(

    "click",

    function(event){

        if(
            event.target ===
            modalMask
        ){

            closeModal();

        }

    }

);


/* ==================================
   添加账号
================================== */

document
    .getElementById(
        "saveButton"
    )
    .addEventListener(

        "click",

        async function(){

            const name =
                accountName.value.trim();


            const secret =
                secretKey.value
                    .trim()
                    .replace(
                        /\s/g,
                        ""
                    )
                    .toUpperCase();


            /* 名称 */

            if(
                !name
            ){

                showToast(
                    "请输入账号名称"
                );

                accountName.focus();

                return;

            }


            /* 密钥 */

            if(
                !secret
            ){

                showToast(
                    "请输入 Secret Key"
                );

                secretKey.focus();

                return;

            }


            /* Base32 */

            const bytes =
                base32ToBytes(
                    secret
                );


            if(
                !bytes.length
            ){

                showToast(
                    "Secret Key 格式不正确"
                );

                return;

            }


            /* 测试 */

            const testCode =
                await generateTOTP(
                    secret
                );


            if(
                testCode ===
                "------"
            ){

                showToast(
                    "Secret Key 无法生成验证码"
                );

                return;

            }


            /* 保存 */

            accounts.push({

                id:
                    Date.now().toString(),

                name:
                    name,

                secret:
                    secret

            });


            saveAccounts();


            closeModal();


            await renderAccounts();


            showToast(
                "账号添加成功"
            );

        }

    );


/* ==================================
   每秒刷新
================================== */

setInterval(

    updateCodes,

    1000

);


/* ==================================
   启动
================================== */

renderAccounts();

</script>

</body>
</html>
